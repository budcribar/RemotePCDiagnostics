<!DOCTYPE html>
<html data-theme="light" data-theme-choice="system">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemotePCDiagnostics</title>
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <script>
        // Theme: apply before first paint (no flash). Choice: dark | system | light (default system), kept in localStorage when available.
        (function () {
            var KEY = 'rpd-theme', mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null, mem = null;
            function read() { try { return localStorage.getItem(KEY); } catch (e) { return mem; } }
            function write(v) { mem = v; try { localStorage.setItem(KEY, v); } catch (e) { } }
            function norm(v) { v = (v || '').toLowerCase().trim(); return v === 'dark' || v === 'light' ? v : 'system'; }
            function apply() {
                var c = norm(read()), d = document.documentElement;
                d.setAttribute('data-theme', c === 'system' ? (mq && mq.matches ? 'dark' : 'light') : c);
                d.setAttribute('data-theme-choice', c);
                return c;
            }
            if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
            window.rpdTheme = { get: function () { return norm(read()); }, set: function (v) { write(norm(v)); return apply(); } };
            apply();
        })();
    </script>
    <script>
        // Desktop host: detect local process environment and mark html element.
        (function () {
            if ((window.chrome && window.chrome.webview) || (window.RemoteBlazor && window.RemoteBlazor.isOwner)) {
                document.documentElement.classList.add('rpd-desktop-host');
            }
        })();
    </script>
    <script>
        // Checks & tests splitter: drag or arrow keys, clamped 28-75%, kept in localStorage.
        window.rpdSplit = (function () {
            var KEY = 'rpd-split', MIN = 28, MAX = 75;
            function read() { try { var v = parseFloat(localStorage.getItem(KEY)); return isNaN(v) ? 55 : v; } catch (e) { return 55; } }
            function clamp(v) { return Math.max(MIN, Math.min(MAX, v)); }
            function apply(ws, v) { v = clamp(v); ws.style.setProperty('--ct-split', v + '%'); var sp = ws.querySelector('.ct-splitter'); if (sp) sp.setAttribute('aria-valuenow', Math.round(v)); return v; }
            function save(v) { try { localStorage.setItem(KEY, String(v)); } catch (e) { } }
            function init() {
                var ws = document.querySelector('.ct-workspace'); if (!ws) return;
                var cur = apply(ws, read());
                var sp = ws.querySelector('.ct-splitter'); if (!sp || sp.dataset.bound) return; sp.dataset.bound = '1';
                sp.addEventListener('pointerdown', function (e) {
                    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('active'); document.body.classList.add('ct-resizing');
                    function move(ev) { var r = ws.getBoundingClientRect(); cur = apply(ws, (ev.clientX - r.left) / r.width * 100); }
                    function up() { sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); sp.removeEventListener('pointercancel', up); sp.classList.remove('active'); document.body.classList.remove('ct-resizing'); save(cur); }
                    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up); sp.addEventListener('pointercancel', up);
                });
                sp.addEventListener('keydown', function (e) {
                    var d = e.key === 'ArrowLeft' ? -2 : e.key === 'ArrowRight' ? 2 : e.key === 'Home' ? -100 : e.key === 'End' ? 100 : 0;
                    if (!d) return; e.preventDefault(); cur = apply(ws, cur + d); save(cur);
                });
            }
            // Stacked layout (<= 900px, matches app.css): the details sit below the whole list, so bring them into view after a tap.
            function showDetail() {
                if (!window.matchMedia || !window.matchMedia('(max-width: 900px)').matches) return;
                var d = document.querySelector('.ct-detail'); if (d && d.scrollIntoView) d.scrollIntoView({ block: 'start', behavior: 'smooth' });
            }
            return { init: init, showDetail: showDetail };
        })();
    </script>
    <link href="_content/RemotePCDiagnostics.UI/app.css" rel="stylesheet" />
    <style>
        .rpd-splash-wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07090c;
            color: #d6e2ea;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            user-select: none;
            z-index: 99999;
        }
        [data-theme="light"] .rpd-splash-wrap {
            background: #f4f6fa;
            color: #1e2633;
        }
        .rpd-splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 32px 36px;
            border-radius: 20px;
            background: #0d1218;
            border: 1px solid #163a44;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 90%;
            text-align: center;
        }
        [data-theme="light"] .rpd-splash-card {
            background: #ffffff;
            border-color: #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .rpd-splash-img {
            width: 220px;
            height: 180px;
            border-radius: 12px;
            object-fit: contain;
            display: block;
        }
        .rpd-splash-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .rpd-splash-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8fa3b3;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }
        [data-theme="light"] .rpd-splash-status {
            color: #5b6676;
        }
        .rpd-splash-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 8px #00e5ff;
            animation: rpd-pulse-anim 1.8s infinite cubic-bezier(0.45, 0, 0.55, 1);
        }
        [data-theme="light"] .rpd-splash-pulse {
            background: #2563eb;
            box-shadow: 0 0 8px #2563eb;
        }
        @keyframes rpd-pulse-anim {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
        .rpd-splash-bar {
            width: 160px;
            height: 3px;
            background: #163a44;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        [data-theme="light"] .rpd-splash-bar {
            background: #e2e8f0;
        }
        .rpd-splash-bar-fill {
            position: absolute;
            top: 0; bottom: 0;
            width: 45%;
            background: #00e5ff;
            border-radius: 2px;
            animation: rpd-bar-anim 1.5s infinite ease-in-out;
        }
        [data-theme="light"] .rpd-splash-bar-fill {
            background: #2563eb;
        }
        @keyframes rpd-bar-anim {
            0% { left: -45%; width: 45%; }
            50% { left: 30%; width: 55%; }
            100% { left: 100%; width: 45%; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="rpd-splash-wrap">
            <div class="rpd-splash-card">
                <img class="rpd-splash-img" src="img/diagnostic-pulse.gif" alt="Remote PC Diagnostics" width="220" height="180" />
                <div class="rpd-splash-title">Remote PC Diagnostics</div>
                <div class="rpd-splash-status">
                    <span class="rpd-splash-pulse"></span>
                    <span>Starting diagnostic engine…</span>
                </div>
                <div class="rpd-splash-bar">
                    <div class="rpd-splash-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- TODO: verify script name for PeakSWC.RemoteBlazorWebView v10 (Microsoft BlazorWebView uses _framework/blazor.webview.js). -->
    <script src="_content/RemotePCDiagnostics.UI/dialogs.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
