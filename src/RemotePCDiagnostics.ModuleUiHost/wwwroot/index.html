<!DOCTYPE html>
<html data-theme="light" data-theme-choice="system">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module</title>
    <!-- Required: the relay rewrites this to /{id}/, which ties the page's files and calls to this module's UI process. -->
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <script>
        // The app's theme (IModuleUi.Theme: dark | system | light), applied like the app's own page so its stylesheet's tokens match.
        // Nothing is stored: the frame has an opaque origin, and the app sends the choice.
        (function () {
            var choice = 'system', mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
            function norm(v) { v = (v || '').toLowerCase().trim(); return v === 'dark' || v === 'light' ? v : 'system'; }
            function apply() {
                var d = document.documentElement;
                d.setAttribute('data-theme', choice === 'system' ? (mq && mq.matches ? 'dark' : 'light') : choice);
                d.setAttribute('data-theme-choice', choice);
                return choice;
            }
            if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
            window.rpdTheme = { get: function () { return choice; }, set: function (v) { choice = norm(v); return apply(); } };
            apply();
        })();
    </script>
    <!-- The app's own stylesheet (RemotePCDiagnostics.UI/wwwroot/app.css, linked in at build), so a module UI that uses the app's classes
         looks the same in and out of process. The frame keeps the page's background showing through. -->
    <link href="app.css" rel="stylesheet" />
    <style>
        body { padding: 12px; background: transparent; background-image: none; }
        .module-ui-error { color: #b42318; }
    </style>
</head>
<body>
    <div id="app">Loading…</div>
    <script>
        // The page runs in a sandboxed frame on the module page. The only thing it tells the app is its height
        // (RemoteComponentFrame.HeightScript, kept in step with the RemoteComponents package).
        (function () {
            var last = 0;
            function post() {
                var h = Math.ceil(document.documentElement.scrollHeight);
                if (h !== last) { last = h; window.parent.postMessage({ type: 'rbwv-remote-height', height: h }, '*'); }
            }
            if (window.ResizeObserver) new ResizeObserver(post).observe(document.documentElement);
            window.addEventListener('load', post);
        })();
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
