name: ARM64 vs x64 Startup Benchmark

on:
  push:
    branches:
      - 'perf/arm64-**'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of warm runs per architecture'
        required: false
        default: '5'
      include_no_r2r:
        description: 'Also benchmark standard JIT (PublishReadyToRun=false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark-arm64-vs-x64:
    name: Benchmark win-arm64 vs win-x64 on Windows 11 ARM64
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run ARM64 vs x64 Startup Benchmark
        shell: pwsh
        run: |
          $runs = if ('${{ inputs.runs }}') { [int]'${{ inputs.runs }}' } else { 5 }
          $argsList = @('-NoProfile', '-File', 'scripts/benchmark-arm64-vs-x64.ps1', '-Runs', $runs)
          if ('${{ inputs.include_no_r2r }}' -eq 'true') {
            $argsList += '-IncludeNoR2R'
          }
          & pwsh @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-vs-x64-benchmark-results
          path: |
            artifacts/benchmark/arm64-vs-x64/arm64-vs-x64-report.md
            artifacts/benchmark/arm64-vs-x64/arm64-vs-x64-results.json
          if-no-files-found: warn
          retention-days: 7
