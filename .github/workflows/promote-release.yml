name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source release tag (e.g. prerelease)'
        default: 'prerelease'
        required: true
      target_tag:
        description: 'Target release tag (e.g. v1.2.0)'
        default: 'v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Copy assets from source to target release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          mkdir -p /tmp/assets
          echo "Downloading assets from ${SOURCE_TAG}..."
          gh release download "${SOURCE_TAG}" -D /tmp/assets --repo "$GITHUB_REPOSITORY"
          echo "Uploading assets to ${TARGET_TAG}..."
          gh release upload "${TARGET_TAG}" /tmp/assets/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Assets uploaded successfully."
