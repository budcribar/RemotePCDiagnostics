name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-workflow:
    name: Service workflow (simulated restarts)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure RemoteBlazorWebView packages
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:GITHUB_WORKSPACE 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          if (@(Get-ChildItem $pkgDir -Filter 'PeakSWC.RemoteBlazorWebView.RemoteComponents.*.nupkg' -ErrorAction SilentlyContinue).Count -eq 0) {
            [xml]$props = Get-Content Directory.Build.props
            $rbwvVer = ($props.Project.PropertyGroup.RbwvVersion | Select-Object -First 1).Trim()
            $suffix = if ($rbwvVer -match '-(.+)$') { $Matches[1] } else { '' }
            $srcRoot = Join-Path $env:RUNNER_TEMP 'rbwv-src/RemoteBlazorWebView'
            git clone --branch net10 --depth 1 https://github.com/budcribar/RemoteBlazorWebView.git $srcRoot
            $packArgs = @('pack', "$srcRoot/src/RemoteBlazorWebView.RemoteComponents", '-c', 'Release', '-p:GeneratePackageOnBuild=false', '-o', $pkgDir)
            if ($suffix) { $packArgs += "-p:VersionSuffix=$suffix" }
            & dotnet @packArgs
            if ($LASTEXITCODE -ne 0) { throw "Packing RemoteComponents failed ($LASTEXITCODE)" }
          }
      - name: Test workflow, saved-state resume, and client reports
        run: dotnet test tests/RemotePCDiagnostics.Tests/RemotePCDiagnostics.Tests.csproj -c Release --filter "FullyQualifiedName~RemotePCDiagnostics.Tests.WorkflowTests" --logger "trx;LogFileName=workflow.trx" --results-directory artifacts/workflow-tests
      - name: Verify workflow tests ran
        shell: pwsh
        run: |
          [xml]$results = Get-Content artifacts/workflow-tests/workflow.trx
          $counts = $results.TestRun.ResultSummary.Counters
          if ([int]$counts.executed -lt 1) { throw 'No service workflow tests executed' }
          if ([int]$counts.failed -gt 0) { throw 'Service workflow tests failed' }
          "Service workflow tests: $($counts.passed) passed"
      - name: Upload workflow test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-workflow-results
          path: artifacts/workflow-tests/
          if-no-files-found: warn
          retention-days: 3

  build-test-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure RemoteBlazorWebView packages
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:GITHUB_WORKSPACE 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          if (@(Get-ChildItem $pkgDir -Filter 'PeakSWC.RemoteBlazorWebView.Wpf.*.nupkg' -ErrorAction SilentlyContinue).Count -eq 0) {
            [xml]$props = Get-Content Directory.Build.props
            $rbwvVer = ($props.Project.PropertyGroup.RbwvVersion | Select-Object -First 1).Trim()
            $suffix = if ($rbwvVer -match '-(.+)$') { $Matches[1] } else { '' }
            $work = Join-Path $env:RUNNER_TEMP 'rbwv-build'
            $srcRoot = Join-Path $work 'RemoteBlazorWebView'
            $tutorialStub = Join-Path $work 'RemoteBlazorWebViewTutorial'
            New-Item -ItemType Directory -Force $tutorialStub | Out-Null
            Set-Content -Path (Join-Path $tutorialStub 'README.md') -Value '# RemoteBlazorWebView'
            git clone --branch net10 --depth 1 https://github.com/budcribar/RemoteBlazorWebView.git $srcRoot
            Push-Location (Join-Path $srcRoot 'src/RemoteWebView.Blazor.JS')
            try {
              # Enable corepack yarn for Web.JS submodule build invoked by build:production, or use npm + webpack.
              corepack enable
              yarn install
              if ($LASTEXITCODE -ne 0) { throw "yarn install failed ($LASTEXITCODE)" }
              npm run build:production
              if ($LASTEXITCODE -ne 0) { throw "JS bundle build failed ($LASTEXITCODE)" }
            } finally { Pop-Location }
            foreach ($p in 'RemoteWebViewService.Lib', 'RemoteWebView', 'RemoteBlazorWebView.RemoteComponents', 'RemoteBlazorWebView.Wpf') {
              $packArgs = @('pack', "$srcRoot/src/$p", '-c', 'Release', '-p:GeneratePackageOnBuild=false', '-o', $pkgDir)
              if ($suffix) { $packArgs += "-p:VersionSuffix=$suffix" }
              & dotnet @packArgs
              if ($LASTEXITCODE -ne 0) { throw "dotnet pack $p failed ($LASTEXITCODE)" }
            }
          }

      - name: Restore
        run: dotnet restore RemotePCDiagnostics.sln

      - name: Build (Release)
        run: dotnet build RemotePCDiagnostics.sln -c Release --no-restore

      - name: Verify bundled osqueryi.exe in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $osq = Join-Path $exe.DirectoryName 'tools/osquery/osqueryi.exe'
          if (-not (Test-Path $osq)) { throw "osqueryi.exe missing from Host output: $osq" }
          (Get-FileHash $osq -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature $osq) | Format-List Status, SignerCertificate
          & $osq --json "SELECT hardware_vendor, hardware_model, physical_memory FROM system_info;"
          if ($LASTEXITCODE -ne 0) { throw "osqueryi.exe exited $LASTEXITCODE" }

      - name: Verify bundled HardeningKitty in Host output and run an audit
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $hk = Join-Path $exe.DirectoryName 'tools/HardeningKitty'
          $psd1 = Join-Path $hk 'HardeningKitty.psd1'
          if (-not (Test-Path $psd1)) { throw "HardeningKitty missing from Host output: $psd1" }
          (Get-FileHash (Join-Path $hk 'HardeningKitty.psm1') -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature (Join-Path $hk 'HardeningKitty.psm1')) | Format-List Status, SignerCertificate
          "{0:N1} MB bundled" -f ((Get-ChildItem $hk -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $csv = Join-Path $env:RUNNER_TEMP 'hk-ci/report.csv'
          New-Item -ItemType Directory -Force (Split-Path $csv) | Out-Null
          # Same command line as SecurityAuditModule.BuildArguments (Windows PowerShell 5.1, policy bypass for this process only).
          $cmd = "`$ErrorActionPreference='Stop';`$ProgressPreference='SilentlyContinue';Import-Module -Name '$psd1' -Force;Invoke-HardeningKitty -Mode Audit -Report -ReportFile '$csv' -SkipMachineInformation -SkipLanguageWarning | Out-Null"
          $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job { param($ps, $cmd) & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd 2>&1 | Select-Object -Last 20; "exit=$LASTEXITCODE" } -ArgumentList $ps, $cmd
          if (-not (Wait-Job $job -Timeout 600)) { Stop-Job $job; throw 'HardeningKitty audit exceeded 10 minutes' }
          Receive-Job $job
          "elapsed=$($sw.Elapsed)"
          if (-not (Test-Path $csv)) { throw 'No HardeningKitty report produced' }
          $rows = Import-Csv $csv
          "rows=$($rows.Count)"; $rows | Group-Object TestResult | Format-Table Name, Count
          $rows | Select-Object -First 5 | Format-Table ID, Category, Name, Severity, Result, Recommended, TestResult
          if ($rows.Count -lt 10) { throw "Too few audit rows: $($rows.Count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $csv artifacts/hardeningkitty-ci-report.csv

      - name: Verify memory test helper in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $mt = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.MemTest.exe'
          if (-not (Test-Path $mt)) { throw "RemotePCDiagnostics.MemTest.exe missing from Host output: $mt" }
          $out = & $mt --bytes 67108864 --seconds 2
          $out | Select-Object -Last 2
          if (-not ($out -match '^MT DONE 67108864 \d+ 0$')) { throw "memory test helper did not report a clean DONE" }

      - name: Unit tests
        run: dotnet test RemotePCDiagnostics.sln -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Publish portable diagnostics app (single self-contained exe)
        shell: pwsh
        run: |
          dotnet publish src/RemotePCDiagnostics.Host/RemotePCDiagnostics.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishProfile=Portable -p:DebugType=None -p:DebugSymbols=false -o artifacts/RemotePCDiagnostics-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Portable publish failed' }
          $files = @(Get-ChildItem artifacts/RemotePCDiagnostics-win-x64 -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'RemotePCDiagnostics.Host.exe') { throw 'Portable output must contain exactly one executable' }
          $env:RPD_LOG_FILE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-check.log'
          $check = Start-Process -FilePath $files[0].FullName -ArgumentList '--verify-package' -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { Stop-Process -Id $check.Id -Force; throw 'Package verification timed out' }
          if ($check.ExitCode -ne 0) { throw "Package verification failed: $($check.ExitCode)" }
          Get-Content $env:RPD_LOG_FILE
          Remove-Item Env:RPD_LOG_FILE -ErrorAction SilentlyContinue

      # Tester download: only for pushes to main and tags (no job downloads it; the smoke test runs the local publish output).
      - name: Upload portable diagnostics download
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-win-x64
          path: artifacts/RemotePCDiagnostics-win-x64/RemotePCDiagnostics.Host.exe
          if-no-files-found: error
          retention-days: 7

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build and smoke-test Windows installer (Inno Setup)
        shell: pwsh
        run: |
          pwsh -NoProfile -File installer/Build-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 failed ($LASTEXITCODE)" }

          $setup = Get-ChildItem artifacts/installer -Filter 'RemotePCDiagnostics-Setup-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer executable was not produced' }

          $installDir = Join-Path $env:RUNNER_TEMP 'rpd-installed'
          $installProc = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SKIPWEBVIEW2 /DIR=`"$installDir`"" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) { throw "Silent install failed with exit code $($installProc.ExitCode)" }

          $installedHost = Join-Path $installDir 'RemotePCDiagnostics.Host.exe'
          $installedUiHost = Join-Path $installDir 'moduleui/RemotePCDiagnostics.ModuleUiHost.exe'
          if (-not (Test-Path -LiteralPath $installedHost)) { throw "Installed Host missing: $installedHost" }
          if (-not (Test-Path -LiteralPath $installedUiHost)) { throw "Installed ModuleUiHost missing: $installedUiHost" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'modules'))) { throw 'modules folder was not created by installer' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'checks'))) { throw 'checks folder was not created by installer' }

          $env:RPD_LOG_FILE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installed-package-check.log'
          $verify = Start-Process -FilePath $installedHost -ArgumentList '--verify-package' -WorkingDirectory $installDir -WindowStyle Hidden -PassThru
          if (-not $verify.WaitForExit(60000)) { Stop-Process -Id $verify.Id -Force; throw 'Installed package verification timed out' }
          if ($verify.ExitCode -ne 0) { throw "Installed package verification failed: $($verify.ExitCode)" }
          Get-Content $env:RPD_LOG_FILE
          Remove-Item Env:RPD_LOG_FILE -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Uninstaller missing: $uninstaller" }
          $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstallProc.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstallProc.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installedHost); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installedHost) { throw 'Uninstaller left RemotePCDiagnostics.Host.exe behind' }
          "Installer silent install, package check, and silent uninstall verified."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: |
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      # The standalone prototypes live outside RemotePCDiagnostics.sln (tools/prototypes/Prototypes.slnx); build them so they keep compiling.
      - name: Build prototypes
        run: dotnet build tools/prototypes/Prototypes.slnx -c Release

      - name: Publish OutlookBenchmark (single exe)
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/OutlookBenchmark/OutlookBenchmark.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/OutlookBenchmark
          $exe = 'artifacts/OutlookBenchmark/OutlookBenchmark.exe'
          if (-not (Test-Path $exe)) { throw 'OutlookBenchmark.exe was not published' }
          # Smoke run on the runner (no Outlook there): inventory only, must exit 0 and write results.
          & $exe --skip-start-test --no-reference --yes --out artifacts/OutlookBenchmark/smoke-results
          if ($LASTEXITCODE -ne 0) { throw "OutlookBenchmark exited $LASTEXITCODE" }
          if (-not (Test-Path artifacts/OutlookBenchmark/smoke-results/results.csv)) { throw 'results.csv missing' }
          Get-Content artifacts/OutlookBenchmark/smoke-results/results.csv

      - name: Publish network history prototype and test demo export
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/NetworkUsagePrototype/NetworkUsagePrototype.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/NetworkUsagePrototype
          if ($LASTEXITCODE -ne 0) { throw 'Network usage prototype publish failed' }
          Copy-Item docs/network-usage-prototype.md artifacts/NetworkUsagePrototype/README.md
          & artifacts/NetworkUsagePrototype/NetworkUsagePrototype.exe --demo --out artifacts/network-demo
          if ($LASTEXITCODE -ne 0) { throw 'Network usage demo export failed' }
          $report = Get-Content artifacts/network-demo/network-usage.json -Raw | ConvertFrom-Json
          if ($report.Entries.Count -ne 1 -or $report.Source -notlike 'DEMO*') { throw 'Unexpected demo report' }
          if (-not (Test-Path artifacts/network-demo/network-usage.html)) { throw 'HTML report missing' }

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/test-results -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Output "::notice title=Unit tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed)"
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' } | Select-Object -First 40 | ForEach-Object {
              $m = ([string]$_.Output.ErrorInfo.Message) -replace '\r?\n', ' '
              if ($m.Length -gt 300) { $m = $m.Substring(0, 300) }
              $t = ([string]$_.testName).Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
              Write-Output "::error title=$t::$($m.Replace('%', '%25'))"
            }
          }

      - name: Install Playwright
        working-directory: tests/smoke
        run: npm install --no-audit --no-fund

      - name: Launch Host and run Playwright smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          $exe = Get-Item artifacts/RemotePCDiagnostics-win-x64/RemotePCDiagnostics.Host.exe
          # Runners are already elevated, so the requireAdministrator manifest does not prompt.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:RPD_LOG_FILE = Join-Path $art 'host.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden -PassThru
          "Host started, pid $($p.Id)"
          $env:APP_PID = $p.Id
          $env:CDP_PORT = '9222'
          $env:ARTIFACT_DIR = $art
          Push-Location tests/smoke
          try { node smoke.mjs 2>&1 | Tee-Object -FilePath (Join-Path $art 'smoke.txt'); $code = $LASTEXITCODE } finally { Pop-Location }
          if ($code -ne 0) {
            # Surface the failure as annotations (readable without downloading logs).
            Get-Content (Join-Path $art 'smoke.txt') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { "::error title=smoke::" + ([string]$_).Replace('%', '%25') }
            Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue | Select-String -Pattern 'error|exception|fail' | Select-Object -Last 8 | ForEach-Object { "::warning title=host.log::" + ([string]$_).Replace('%', '%25') }
            Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-File (Join-Path $art 'webview2-processes.txt')
            netstat -ano | Select-String ':9222' | Out-File (Join-Path $art 'netstat-9222.txt')
            Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue
          }
          if ($p.HasExited) { "Host exited with code $($p.ExitCode)" } else { Stop-Process -Id $p.Id -Force }
          exit $code

      # Logs, test results and smoke screenshots only (no binaries or publish output), and only when the job failed.
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.csv
            artifacts/test-results/**/*.trx
            artifacts/OutlookBenchmark/smoke-results/
            artifacts/network-demo/
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [service-workflow, build-test-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: release-assets

      - name: Download portable executable artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-win-x64
          path: release-portable

      - name: Rename portable executable for release
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cp release-portable/RemotePCDiagnostics.Host.exe "release-assets/RemotePCDiagnostics-Portable-${tag}-win-x64.exe"
          (cd release-assets && sha256sum "RemotePCDiagnostics-Portable-${tag}-win-x64.exe" > "RemotePCDiagnostics-Portable-${tag}-win-x64.exe.sha256")
          ls -lh release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "Remote PC Diagnostics $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi

