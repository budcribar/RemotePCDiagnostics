name: CI

on:
  push:
    branches:
      - '**'
      - '!perf/**'
    tags-ignore:
      - prerelease
      - 'build-*'
  pull_request:
  workflow_dispatch:
    inputs:
      testshop_only:
        description: 'Development build: only build and smoke-test the TestShop installer (skips tests, the other packages and the release). A push to a branch other than main does the same when its commit message contains [testshop-only].'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Optional version tag to publish as a full GitHub Release (e.g. v1.2.0). Leave empty for rolling pre-release.'
        required: false
        type: string
        default: ''
      msix_identity_name:
        description: 'Optional Partner Center Package/Identity/Name (e.g. 12345BudCribar.RemotePCDiagnostics). Falls back to vars.MSIX_IDENTITY_NAME.'
        required: false
        type: string
        default: ''
      msix_publisher:
        description: 'Optional Partner Center Package/Identity/Publisher (e.g. CN=00000000-0000-0000-0000-000000000000). Falls back to vars.MSIX_PUBLISHER.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run there. Runs on main and on tags always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# The packages are built by separate jobs that run at the same time: build-test (build, verify, unit tests, prototypes),
# installer (Setup.exe), testshop (TestShop bundle), agent (Agent EXE + MSI) and smoke (MSIX + Playwright). Each
# publishes what it needs itself, which is faster than publishing once and handing the files around as artifacts.
# TestShop-only runs (see the testshop_only input) skip every job but testshop.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PUBLISH_ARTIFACTS: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
  TESTSHOP_ONLY: ${{ (inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) && 'true' || 'false' }}
  # Full compression only for installers that get uploaded for a release; pull requests and TestShop-only runs use fast.
  INSTALLER_COMPRESSION: ${{ (((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch') && !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]')))) && 'lzma2/ultra64' || 'lzma2/fast' }}

jobs:
  service-workflow:
    name: Service workflow (simulated restarts)
    if: ${{ !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rpcd
      - name: Test workflow, saved-state resume, and client reports
        run: dotnet test --project tests/RemotePCDiagnostics.Tests/RemotePCDiagnostics.Tests.csproj -c Release --filter-class "RemotePCDiagnostics.Tests.WorkflowTests" --report-xunit-trx --report-xunit-trx-filename workflow.trx --results-directory artifacts/workflow-tests
      - name: Verify workflow tests ran
        shell: pwsh
        run: |
          [xml]$results = Get-Content artifacts/workflow-tests/workflow.trx
          $counts = $results.TestRun.ResultSummary.Counters
          if ([int]$counts.executed -lt 1) { throw 'No service workflow tests executed' }
          if ([int]$counts.failed -gt 0) { throw 'Service workflow tests failed' }
          "Service workflow tests: $($counts.passed) passed"
      - name: Upload workflow test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-workflow-results
          path: artifacts/workflow-tests/
          if-no-files-found: warn
          retention-days: 3

  build-test:
    name: Build, verify and unit tests
    if: ${{ !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rpcd

      - name: Restore
        run: dotnet restore RemotePCDiagnostics.sln

      - name: Build (Release)
        run: dotnet build RemotePCDiagnostics.sln -c Release --no-restore

      - name: Verify the Setup edition ships no osqueryi.exe
        shell: pwsh
        run: |
          # Setup reads through the Agent; only the Store edition (-p:RpcdEdition=Store) bundles osquery for its legacy readers.
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $osq = Join-Path $exe.DirectoryName 'tools/osquery/osqueryi.exe'
          if (Test-Path $osq) { throw "osqueryi.exe is in the Setup edition's Host output: $osq" }

      - name: Verify bundled HardeningKitty in Host output and run an audit
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $hk = Join-Path $exe.DirectoryName 'tools/HardeningKitty'
          $psd1 = Join-Path $hk 'HardeningKitty.psd1'
          if (-not (Test-Path $psd1)) { throw "HardeningKitty missing from Host output: $psd1" }
          (Get-FileHash (Join-Path $hk 'HardeningKitty.psm1') -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature (Join-Path $hk 'HardeningKitty.psm1')) | Format-List Status, SignerCertificate
          "{0:N1} MB bundled" -f ((Get-ChildItem $hk -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $csv = Join-Path $env:RUNNER_TEMP 'hk-ci/report.csv'
          New-Item -ItemType Directory -Force (Split-Path $csv) | Out-Null
          # Same command line as SecurityAuditModule.BuildArguments (Windows PowerShell 5.1, policy bypass for this process only).
          $cmd = "`$ErrorActionPreference='Stop';`$ProgressPreference='SilentlyContinue';Import-Module -Name '$psd1' -Force;Invoke-HardeningKitty -Mode Audit -Report -ReportFile '$csv' -SkipMachineInformation -SkipLanguageWarning | Out-Null"
          $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job { param($ps, $cmd) & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd 2>&1 | Select-Object -Last 20; "exit=$LASTEXITCODE" } -ArgumentList $ps, $cmd
          try {
            if (-not (Wait-Job $job -Timeout 600)) { Stop-Job $job; throw 'HardeningKitty audit exceeded 10 minutes' }
            $jobOut = Receive-Job $job
            $jobOut
            if (-not (@($jobOut | ForEach-Object { "$_" }) -contains 'exit=0')) { throw 'HardeningKitty PowerShell failed' }
          } finally {
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
          "elapsed=$($sw.Elapsed)"
          if (-not (Test-Path $csv)) { throw 'No HardeningKitty report produced' }
          $rows = Import-Csv $csv
          "rows=$($rows.Count)"; $rows | Group-Object TestResult | Format-Table Name, Count
          $rows | Select-Object -First 5 | Format-Table ID, Category, Name, Severity, Result, Recommended, TestResult
          if ($rows.Count -lt 10) { throw "Too few audit rows: $($rows.Count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $csv artifacts/hardeningkitty-ci-report.csv

      - name: Verify memory test and admin repair helpers in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $mt = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.MemTest.exe'
          if (-not (Test-Path $mt)) { throw "RemotePCDiagnostics.MemTest.exe missing from Host output: $mt" }
          $out = & $mt --bytes 67108864 --seconds 2
          $out | Select-Object -Last 2
          if (-not ($out -match '^MT DONE 67108864 \d+ 0$')) { throw "memory test helper did not report a clean DONE" }

          $adminExe = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.Agent.exe'
          if (-not (Test-Path $adminExe)) { throw "RemotePCDiagnostics.Agent.exe missing from Host output: $adminExe" }
          & $adminExe --self-check
          if ($LASTEXITCODE -ne 0) { throw "RemotePCDiagnostics.Agent.exe --self-check exited $LASTEXITCODE" }

      - name: Unit tests
        run: dotnet test --solution RemotePCDiagnostics.sln -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      # Browser-only checks against the UI source (no Host needed), so they run here instead of in the smoke job.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run UI regression checks
        working-directory: tests/smoke
        run: |
          npm install --no-audit --no-fund
          node ui-review.mjs

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/test-results)) { return }
          Get-ChildItem artifacts/test-results -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Output "::notice title=Unit tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed)"
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' } | Select-Object -First 40 | ForEach-Object {
              $m = ([string]$_.Output.ErrorInfo.Message) -replace '\r?\n', ' '
              if ($m.Length -gt 300) { $m = $m.Substring(0, 300) }
              $t = ([string]$_.testName).Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
              Write-Output "::error title=$t::$($m.Replace('%', '%25'))"
            }
          }

      # The standalone prototypes live outside RemotePCDiagnostics.sln (tools/prototypes/Prototypes.slnx); build them so they keep compiling.
      - name: Build prototypes
        run: dotnet build tools/prototypes/Prototypes.slnx -c Release

      - name: Publish OutlookBenchmark (single exe)
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/OutlookBenchmark/OutlookBenchmark.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/OutlookBenchmark
          $exe = 'artifacts/OutlookBenchmark/OutlookBenchmark.exe'
          if (-not (Test-Path $exe)) { throw 'OutlookBenchmark.exe was not published' }
          # Smoke run on the runner (no Outlook there): inventory only, must exit 0 and write results.
          & $exe --skip-start-test --no-reference --yes --out artifacts/OutlookBenchmark/smoke-results
          if ($LASTEXITCODE -ne 0) { throw "OutlookBenchmark exited $LASTEXITCODE" }
          if (-not (Test-Path artifacts/OutlookBenchmark/smoke-results/results.csv)) { throw 'results.csv missing' }
          Get-Content artifacts/OutlookBenchmark/smoke-results/results.csv

      - name: Publish network history prototype and test demo export
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/NetworkUsagePrototype/NetworkUsagePrototype.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/NetworkUsagePrototype
          if ($LASTEXITCODE -ne 0) { throw 'Network usage prototype publish failed' }
          Copy-Item tools/prototypes/NetworkUsagePrototype/README.md artifacts/NetworkUsagePrototype/README.md
          & artifacts/NetworkUsagePrototype/NetworkUsagePrototype.exe --demo --out artifacts/network-demo
          if ($LASTEXITCODE -ne 0) { throw 'Network usage demo export failed' }
          $report = Get-Content artifacts/network-demo/network-usage.json -Raw | ConvertFrom-Json
          if ($report.Entries.Count -ne 1 -or $report.Source -notlike 'DEMO*') { throw 'Unexpected demo report' }
          if (-not (Test-Path artifacts/network-demo/network-usage.html)) { throw 'HTML report missing' }

      # Logs and test results only (no binaries), and only when the job failed.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-build-test
          path: |
            artifacts/*.csv
            artifacts/test-results/**/*.trx
            artifacts/OutlookBenchmark/smoke-results/
            artifacts/network-demo/
          if-no-files-found: warn
          retention-days: 1

  installer:
    name: Windows installer (Setup.exe)
    if: ${{ !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rpcd

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build and smoke-test Windows installer (Inno Setup)
        shell: pwsh
        run: |
          # The plain Setup embeds the Agent MSI and, on upgrade, runs it when the service is already installed.
          # The agent is published from a second worktree so it does not share obj or the compiler with the app.
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_['Version'] } | Where-Object { $_ } | Select-Object -First 1).InnerText.Trim()
          $src = Join-Path $env:RUNNER_TEMP 'agent-src-installer'
          git worktree add --detach $src HEAD
          if ($LASTEXITCODE -ne 0) { throw "git worktree add failed ($LASTEXITCODE)" }
          $srcPkgDir = Join-Path $src 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $srcPkgDir | Out-Null
          Copy-Item third_party/RemoteBlazorWebView/packages/* -Destination $srcPkgDir -ErrorAction SilentlyContinue

          $pubDir = Join-Path $env:RUNNER_TEMP 'agent-publish-installer'
          $log = Join-Path $env:RUNNER_TEMP 'agent-publish-installer.log'
          $publishArgs = @('publish', (Join-Path $src 'src/RemotePCDiagnostics.Agent/RemotePCDiagnostics.Agent.csproj'), '-c', 'Release', '-r', 'win-x64', '--self-contained',
            '-p:PublishSingleFile=true', '-p:PublishReadyToRun=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:DebugType=None', '-p:UseSharedCompilation=false', '-nodeReuse:false', '-o', $pubDir)
          $agent = Start-Process -FilePath 'dotnet' -ArgumentList $publishArgs -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $null = $agent.Handle

          pwsh -NoProfile -File installer/Build-Installer.ps1 -StageOnly -Compression $env:INSTALLER_COMPRESSION
          $appCode = $LASTEXITCODE
          $agent.WaitForExit()
          "--- Agent publish output ---"
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          if ($appCode -ne 0) { throw "Build-Installer.ps1 -StageOnly failed ($appCode)" }
          if ($agent.ExitCode -ne 0) { throw "Agent publish failed ($($agent.ExitCode))" }

          $agentOutDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent'
          New-Item -ItemType Directory -Force $agentOutDir | Out-Null
          $agentDest = Join-Path $agentOutDir "RemotePCDiagnostics.Agent-$ver-win-x64.exe"
          Copy-Item -LiteralPath (Join-Path $pubDir 'RemotePCDiagnostics.Agent.exe') -Destination $agentDest -Force
          pwsh -NoProfile -File msi/Build-AgentMsi.ps1 -Version $ver -SkipPublish -AgentExePath $agentDest -OutputDir $agentOutDir
          if ($LASTEXITCODE -ne 0) { throw "Build-AgentMsi.ps1 failed ($LASTEXITCODE)" }
          $agentMsi = Join-Path $agentOutDir "RemotePCDiagnostics.Agent-$ver-win-x64.msi"
          if (-not (Test-Path -LiteralPath $agentMsi)) { throw "Agent MSI missing: $agentMsi" }

          # No -AgentEnrollmentKey and no -AgentExePath: the regular Setup must not bake a key or the TestShop install path.
          pwsh -NoProfile -File installer/Build-Installer.ps1 -SkipPublish -SkipVerify -Compression $env:INSTALLER_COMPRESSION -AgentMsiPath $agentMsi
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 failed ($LASTEXITCODE)" }

          $setup = Get-ChildItem artifacts/installer -Filter 'RemotePCDiagnostics-Setup-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer executable was not produced' }

          $installDir = Join-Path $env:RUNNER_TEMP 'rpd-installed'
          $installProc = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SKIPWEBVIEW2 /DIR=`"$installDir`"" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) { throw "Silent install failed with exit code $($installProc.ExitCode)" }

          $installedHost = Join-Path $installDir 'RemotePCDiagnostics.Host.exe'
          $installedAdmin = Join-Path $installDir 'RemotePCDiagnostics.Agent.exe'
          $installedUiHost = Join-Path $installDir 'moduleui/RemotePCDiagnostics.ModuleUiHost.exe'
          if (-not (Test-Path -LiteralPath $installedHost)) { throw "Installed Host missing: $installedHost" }
          if (-not (Test-Path -LiteralPath $installedAdmin)) { throw "Installed Admin helper missing: $installedAdmin" }
          if (-not (Test-Path -LiteralPath $installedUiHost)) { throw "Installed ModuleUiHost missing: $installedUiHost" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'modules'))) { throw 'modules folder was not created by installer' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'checks'))) { throw 'checks folder was not created by installer' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'benchmarks/speedometer-3.1.zip'))) { throw 'benchmarks/speedometer-3.1.zip was not bundled by installer' }
          $serviceExe = 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
          if (Test-Path -LiteralPath $serviceExe) { throw 'Plain Setup installed the agent service on a fresh PC' }
          if ($null -ne (Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue)) { throw 'Plain Setup created the RemotePCDiagnosticsAgent service on a fresh PC' }

          $env:RPD_LOG_FILE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installed-package-check.log'
          $verify = Start-Process -FilePath $installedHost -ArgumentList '--verify-package' -WorkingDirectory $installDir -WindowStyle Hidden -PassThru
          if (-not $verify.WaitForExit(60000)) { & taskkill.exe /F /T /PID $verify.Id 2>$null | Out-Null; Stop-Process -Id $verify.Id -Force -ErrorAction SilentlyContinue; throw 'Installed package verification timed out' }
          if ($verify.ExitCode -ne 0) { throw "Installed package verification failed: $($verify.ExitCode)" }
          Get-Content $env:RPD_LOG_FILE
          Remove-Item Env:RPD_LOG_FILE -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Uninstaller missing: $uninstaller" }
          $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstallProc.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstallProc.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installedHost); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installedHost) { throw 'Uninstaller left RemotePCDiagnostics.Host.exe behind' }
          "Installer silent install, package check, and silent uninstall verified."

          # Upgrade: an agent that is already installed is refreshed by the bundled MSI, and its enrollment is kept.
          # Install with Agent.exe, not this MSI. msiexec /i of a product that is already installed returns 1603 under
          # /qn and does not put back a file that was removed. The relay is loopback so this runner never enrols publicly.
          # The key is passed only to Agent.exe, not compiled into Setup.
          $smokeServer = 'http://127.0.0.1:9'
          $smokeKey = 'rpd_inv_setupsmoke123456'
          $agentInstallLog = Join-Path $env:GITHUB_WORKSPACE 'artifacts/setup-agent-exe-install.log'
          $agentInstall = Start-Process -FilePath $agentDest -ArgumentList "install --server=$smokeServer --key=$smokeKey --consent=unattended --lifetime=persistent" -Wait -PassThru -RedirectStandardOutput $agentInstallLog -RedirectStandardError "$agentInstallLog.err"
          if ($agentInstall.ExitCode -ne 0) {
            Get-Content $agentInstallLog, "$agentInstallLog.err" -ErrorAction SilentlyContinue | Write-Host
            throw "Agent.exe install before the Setup upgrade failed with exit code $($agentInstall.ExitCode)"
          }
          $installedCfg = 'C:\ProgramData\RemotePCDiagnostics\agent.json'
          if (-not (Test-Path -LiteralPath $serviceExe)) { throw "Agent.exe install did not write $serviceExe" }
          $before = Get-Content -LiteralPath $installedCfg -Raw | ConvertFrom-Json
          if ($before.key -ne $smokeKey -or $before.server -ne $smokeServer -or $before.consent -ne 'unattended' -or $before.lifetime -ne 'persistent') {
            throw "Unexpected agent.json before Setup upgrade: $(Get-Content -LiteralPath $installedCfg -Raw)"
          }

          $upgradeDir = Join-Path $env:RUNNER_TEMP 'rpd-installed-upgrade'
          if (Test-Path $upgradeDir) { Remove-Item $upgradeDir -Recurse -Force }
          $upgradeLog = Join-Path $env:GITHUB_WORKSPACE 'artifacts/setup-agent-upgrade.log'
          $upgradeProc = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SKIPWEBVIEW2 /DIR=`"$upgradeDir`" /LOG=`"$upgradeLog`"" -Wait -PassThru
          if ($upgradeProc.ExitCode -ne 0) {
            if (Test-Path $upgradeLog) { Get-Content $upgradeLog -Tail 120 | Write-Host }
            throw "Setup upgrade failed with exit code $($upgradeProc.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $upgradeLog)) { throw "Setup upgrade did not write $upgradeLog" }
          $upgradeText = Get-Content -LiteralPath $upgradeLog -Raw
          $msiExit = [regex]::Match($upgradeText, 'msiexec\.exe[\s\S]{0,500}?Process exit code: (\d+)')
          if (-not $msiExit.Success) { throw 'Setup upgrade log does not show the bundled Agent MSI running' }
          if ($msiExit.Groups[1].Value -ne '0') {
            Get-Content $upgradeLog -Tail 40 | Write-Host
            throw "Bundled Agent MSI exited $($msiExit.Groups[1].Value)"
          }
          if (-not (Test-Path -LiteralPath $serviceExe)) { throw 'Setup upgrade removed the agent service executable' }
          $after = Get-Content -LiteralPath $installedCfg -Raw | ConvertFrom-Json
          if ($after.key -ne $before.key -or $after.server -ne $before.server -or $after.consent -ne $before.consent -or $after.lifetime -ne $before.lifetime -or $after.machineId -ne $before.machineId) {
            throw "Setup upgrade changed agent.json: $(Get-Content -LiteralPath $installedCfg -Raw)"
          }
          function Get-RpcdProductVersion([string] $path) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).ProductVersion
            if ([string]::IsNullOrWhiteSpace($version)) { throw "No product version on $path" }
            $plus = $version.IndexOf('+')
            if ($plus -gt 0) { $version = $version.Substring(0, $plus) }
            return $version.Trim()
          }
          $hostVersion = Get-RpcdProductVersion (Join-Path $upgradeDir 'RemotePCDiagnostics.Host.exe')
          $agentVersion = Get-RpcdProductVersion $serviceExe
          if ($hostVersion -ne $agentVersion) { throw "Agent $agentVersion did not match app $hostVersion after Setup upgrade" }
          $upgradeUninstall = Join-Path $upgradeDir 'unins000.exe'
          $upgradeUninstallProc = Start-Process -FilePath $upgradeUninstall -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($upgradeUninstallProc.ExitCode -ne 0) { throw "Upgrade uninstall failed with exit code $($upgradeUninstallProc.ExitCode)" }
          for ($i = 0; $i -lt 20 -and ((Test-Path -LiteralPath $serviceExe) -or (Test-Path -LiteralPath $installedCfg)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $serviceExe) { throw 'Setup uninstall left the agent executable behind' }
          if (Test-Path -LiteralPath $installedCfg) { throw 'Setup uninstall left agent.json behind' }
          "Plain Setup upgraded the installed agent from the bundled MSI and kept the enrollment key."

      - name: Upload Windows installer
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: |
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 5

      # Logs and test results only (no binaries), and only when the job failed.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-installer
          path: |
            artifacts/*.log
            artifacts/installer/*.log
          if-no-files-found: warn
          retention-days: 1

  testshop:
    name: TestShop demo bundle (RPCD + RPCDA)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rpcd

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }

      # The Agent EXE (same publish command as the agent job, which tests it on its own) and the app are published at
      # the same time. The Agent builds from a second worktree so the two builds never share obj folders, and with its
      # own compiler (UseSharedCompilation=false) so the two builds never share a VBCSCompiler server either: while they
      # shared one, many full builds failed with Razor parse errors (RZ1021/RZ1009) in module pages that
      # build cleanly on their own (runs 44808390534, 44815786174).
      - name: Publish the Agent EXE and the app
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_['Version'] } | Where-Object { $_ } | Select-Object -First 1).InnerText.Trim()
          $src = Join-Path $env:RUNNER_TEMP 'agent-src'
          git worktree add --detach $src HEAD
          if ($LASTEXITCODE -ne 0) { throw "git worktree add failed ($LASTEXITCODE)" }
          $srcPkgDir = Join-Path $src 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $srcPkgDir | Out-Null
          Copy-Item third_party/RemoteBlazorWebView/packages/* -Destination $srcPkgDir -ErrorAction SilentlyContinue

          $pubDir = Join-Path $env:RUNNER_TEMP 'agent-publish'
          $log = Join-Path $env:RUNNER_TEMP 'agent-publish.log'
          # TestShop-only runs skip ReadyToRun (about a minute less CPU on the 4-core runner); release builds keep it.
          $r2r = if ($env:TESTSHOP_ONLY -eq 'true') { 'false' } else { 'true' }
          $publishArgs = @('publish', (Join-Path $src 'src/RemotePCDiagnostics.Agent/RemotePCDiagnostics.Agent.csproj'), '-c', 'Release', '-r', 'win-x64', '--self-contained',
            '-p:PublishSingleFile=true', "-p:PublishReadyToRun=$r2r", '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:DebugType=None', '-p:UseSharedCompilation=false', '-nodeReuse:false', '-o', $pubDir)
          $agent = Start-Process -FilePath 'dotnet' -ArgumentList $publishArgs -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $null = $agent.Handle  # keeps ExitCode readable after the process ends

          $stageArgs = @('-NoProfile', '-File', 'installer/Build-Installer.ps1', '-StageOnly')
          if ($env:TESTSHOP_ONLY -eq 'true') { $stageArgs += '-NoReadyToRun' }
          pwsh @stageArgs
          $appCode = $LASTEXITCODE

          $agent.WaitForExit()
          "--- Agent publish output ---"
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          if ($appCode -ne 0) { throw "Build-Installer.ps1 -StageOnly failed ($appCode)" }
          if ($agent.ExitCode -ne 0) { throw "Agent publish failed ($($agent.ExitCode))" }

          $agentOutDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent'
          New-Item -ItemType Directory -Force $agentOutDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $pubDir 'RemotePCDiagnostics.Agent.exe') -Destination (Join-Path $agentOutDir "RemotePCDiagnostics.Agent-$ver-win-x64.exe") -Force

      - name: Build and smoke-test TestShop demo bundle installer (RPCD + RPCDA)
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_['Version'] } | Where-Object { $_ } | Select-Object -First 1).InnerText.Trim()
          $agentExe = Join-Path $env:GITHUB_WORKSPACE "artifacts/agent/RemotePCDiagnostics.Agent-$ver-win-x64.exe"
          if (-not (Test-Path -LiteralPath $agentExe)) { throw "Agent EXE missing for bundle: $agentExe" }

          $bundleBaseName = "RemotePCDiagnostics-TestShop-Setup-$ver-win-x64"
          pwsh -NoProfile -File installer/Build-Installer.ps1 `
            -Version $ver `
            -SkipPublish `
            -SkipVerify `
            -Compression $env:INSTALLER_COMPRESSION `
            -OutputBaseName $bundleBaseName `
            -RemoteServerUrl 'https://server.remoteblazorwebview.com:34544' `
            -ShopGroup 'test-shop' `
            -AgentExePath $agentExe `
            -AgentServerUrl 'https://server.remoteblazorwebview.com:34544' `
            -AgentEnrollmentKey 'test-shop' `
            -AgentConsent 'unattended'
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 for TestShop bundle failed ($LASTEXITCODE)" }

          $bundleExe = Join-Path $env:GITHUB_WORKSPACE "artifacts/installer/$bundleBaseName.exe"
          if (-not (Test-Path -LiteralPath $bundleExe)) { throw "TestShop bundle missing: $bundleExe" }
          if (-not (Test-Path -LiteralPath "$bundleExe.sha256")) { throw "TestShop bundle sha256 missing: $bundleExe.sha256" }

          $installDir = Join-Path $env:RUNNER_TEMP 'rpd-testshop-bundle'
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $installLog = Join-Path $env:GITHUB_WORKSPACE 'artifacts/testshop-bundle-install.log'
          # The bundle is built for the public relay with unattended consent. Installing it as built would enrol this runner
          # there as a persistent, unattended computer in the test shop, so the smoke install points the agent at a
          # loopback address (nothing listens on port 9), like the MSI smoke test above.
          $smokeServer = 'http://127.0.0.1:9'
          $installProc = Start-Process -FilePath $bundleExe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SKIPWEBVIEW2 /AGENTSERVER=$smokeServer /DIR=`"$installDir`" /LOG=`"$installLog`"" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 | Write-Host }
            throw "TestShop bundle silent install failed with exit code $($installProc.ExitCode)"
          }

          $installedHost = Join-Path $installDir 'RemotePCDiagnostics.Host.exe'
          try {
            if (-not (Test-Path -LiteralPath $installedHost)) { throw "TestShop bundle did not install $installedHost" }
            $installedAgent = 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
            $installedCfg = 'C:\ProgramData\RemotePCDiagnostics\agent.json'
            if (-not (Test-Path -LiteralPath $installedAgent)) { throw "TestShop bundle did not install $installedAgent" }
            if (-not (Test-Path -LiteralPath $installedCfg)) { throw "TestShop bundle did not write $installedCfg" }
            $cfgJson = Get-Content -LiteralPath $installedCfg -Raw | ConvertFrom-Json
            if ($cfgJson.key -ne 'test-shop' -or $cfgJson.group -ne 'test-shop' -or $cfgJson.consent -ne 'unattended' -or $cfgJson.lifetime -ne 'persistent' -or $cfgJson.server -ne $smokeServer) {
              throw "Unexpected agent.json written by TestShop bundle: $(Get-Content -LiteralPath $installedCfg -Raw)"
            }
            $svc = Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue
            if ($null -eq $svc -or $svc.Status -ne 'Running') {
              throw "Expected RemotePCDiagnosticsAgent service Running after TestShop bundle install, got: $($svc.Status)"
            }
          } finally {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
              if ($uninstallProc.ExitCode -ne 0) { throw "TestShop bundle silent uninstall failed with exit code $($uninstallProc.ExitCode)" }
            }
          }

          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installedHost); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installedHost) { throw 'TestShop bundle uninstall left RemotePCDiagnostics.Host.exe behind' }
          if (Test-Path -LiteralPath 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe') {
            throw 'TestShop bundle uninstall left C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe behind'
          }
          if (Test-Path -LiteralPath 'C:\ProgramData\RemotePCDiagnostics\agent.json') {
            throw 'TestShop bundle uninstall left C:\ProgramData\RemotePCDiagnostics\agent.json behind'
          }
          if ($null -ne (Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue)) {
            throw 'TestShop bundle uninstall left RemotePCDiagnosticsAgent service behind'
          }
          "TestShop demo bundle install (RPCD + RPCDA) + service verification + clean uninstall passed."

      - name: Upload TestShop demo bundle installer
        if: env.PUBLISH_ARTIFACTS == 'true' || env.TESTSHOP_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-TestShop-Setup-win-x64
          path: |
            artifacts/installer/RemotePCDiagnostics-TestShop-Setup-*-win-x64.exe
            artifacts/installer/RemotePCDiagnostics-TestShop-Setup-*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 5

      # Logs and test results only (no binaries), and only when the job failed.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-testshop
          path: |
            artifacts/*.log
            artifacts/installer/*.log
          if-no-files-found: warn
          retention-days: 1

  agent:
    name: MSP Fleet Agent (EXE + MSI)
    if: ${{ !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rpcd

      - name: Publish and smoke-test standalone MSP Fleet Agent (RemotePCDiagnostics.Agent)
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_['Version'] } | Where-Object { $_ } | Select-Object -First 1).InnerText.Trim()
          $pubDir = Join-Path $env:RUNNER_TEMP 'agent-publish'
          if (Test-Path $pubDir) { Remove-Item $pubDir -Recurse -Force }
          dotnet publish src/RemotePCDiagnostics.Agent/RemotePCDiagnostics.Agent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o $pubDir
          if ($LASTEXITCODE -ne 0) { throw "Agent publish failed ($LASTEXITCODE)" }

          $publishedExe = Join-Path $pubDir 'RemotePCDiagnostics.Agent.exe'
          if (-not (Test-Path -LiteralPath $publishedExe)) { throw "Published Agent missing: $publishedExe" }

          $agentOutDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent'
          New-Item -ItemType Directory -Force $agentOutDir | Out-Null
          $agentFileName = "RemotePCDiagnostics.Agent-$ver-win-x64.exe"
          $agentDest = Join-Path $agentOutDir $agentFileName
          Copy-Item -LiteralPath $publishedExe -Destination $agentDest -Force

          $hash = (Get-FileHash -LiteralPath $agentDest -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$agentDest.sha256", "$hash  $agentFileName", $utf8NoBom)

          $checkOut = & $agentDest --self-check
          $checkOut
          if ($LASTEXITCODE -ne 0) { throw "Agent --self-check failed ($LASTEXITCODE)" }

          $helpOut = & $agentDest help
          if ($LASTEXITCODE -ne 0 -or ($helpOut -join "`n") -notmatch 'RemotePCDiagnostics\.Agent\.exe install') {
            throw "Agent help output unexpected ($LASTEXITCODE)"
          }

          & pwsh scripts/benchmark-agent-startup.ps1 -AgentExePath $agentDest -RunsPerTest 3

          $env:RPD_AGENT_CONFIG_PATH = Join-Path $env:RUNNER_TEMP 'rpd-agent-ci/agent.json'
          try {
            $statusOut = & $agentDest status
            $statusOut
            if ($LASTEXITCODE -ne 0 -or ($statusOut -join "`n") -notmatch 'RemotePCDiagnosticsAgent') {
              throw "Agent status failed ($LASTEXITCODE)"
            }
          } finally {
            Remove-Item Env:RPD_AGENT_CONFIG_PATH -ErrorAction SilentlyContinue
          }
          "Built standalone Agent EXE: $agentDest ($([Math]::Round((Get-Item $agentDest).Length / 1MB, 2)) MB, sha256=$hash)"

          pwsh -NoProfile -File msi/Build-AgentMsi.ps1 -Version $ver -SkipPublish -AgentExePath $agentDest -OutputDir $agentOutDir
          if ($LASTEXITCODE -ne 0) { throw "Build-AgentMsi.ps1 failed ($LASTEXITCODE)" }

          $agentMsi = Join-Path $agentOutDir "RemotePCDiagnostics.Agent-$ver-win-x64.msi"
          if (-not (Test-Path -LiteralPath $agentMsi)) { throw "Agent MSI missing: $agentMsi" }
          if (-not (Test-Path -LiteralPath "$agentMsi.sha256")) { throw "Agent MSI sha256 missing: $agentMsi.sha256" }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'rpd-msi-smoke'
          if (Test-Path $smokeDir) { Remove-Item $smokeDir -Recurse -Force }
          New-Item -ItemType Directory -Force $smokeDir | Out-Null
          $b64Loopback = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('http://127.0.0.1:9')).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          $tokenizedMsi = Join-Path $smokeDir "RemotePCDiagnostics-Agent.as.rpd_inv_cismoketest123456.h.$b64Loopback.pkg (1).msi"
          Copy-Item -LiteralPath $agentMsi -Destination $tokenizedMsi -Force

          $installLog = Join-Path $smokeDir 'msi-install.log'
          $installProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$tokenizedMsi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 | Write-Host }
            throw "MSI install smoke-test failed with exit code $($installProc.ExitCode)"
          }

          try {
            $installedExe = 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
            $installedCfg = 'C:\ProgramData\RemotePCDiagnostics\agent.json'
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "MSI did not install $installedExe" }
            if (-not (Test-Path -LiteralPath $installedCfg)) { throw "MSI did not write $installedCfg" }
            $cfgJson = Get-Content -LiteralPath $installedCfg -Raw | ConvertFrom-Json
            if ($cfgJson.key -ne 'rpd_inv_cismoketest123456' -or $cfgJson.consent -ne 'ask' -or $cfgJson.lifetime -ne 'session' -or $cfgJson.server -ne 'http://127.0.0.1:9') {
              throw "Unexpected agent.json written by MSI: $(Get-Content -LiteralPath $installedCfg -Raw)"
            }
            $svc = Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue
            if ($null -eq $svc -or $svc.Status -ne 'Running') {
              throw "Expected RemotePCDiagnosticsAgent service Running after MSI install, got: $($svc.Status)"
            }
          } finally {
            $uninstallLog = Join-Path $smokeDir 'msi-uninstall.log'
            $uninstallProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/x', "`"$tokenizedMsi`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") -Wait -PassThru
            if ($uninstallProc.ExitCode -ne 0) {
              if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 120 | Write-Host }
              throw "MSI uninstall smoke-test failed with exit code $($uninstallProc.ExitCode)"
            }
          }

          if (Test-Path -LiteralPath 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe') {
            throw 'MSI uninstall left behind C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
          }
          if (Test-Path -LiteralPath 'C:\ProgramData\RemotePCDiagnostics\agent.json') {
            throw 'MSI uninstall left behind C:\ProgramData\RemotePCDiagnostics\agent.json'
          }
          if ($null -ne (Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue)) {
            throw 'MSI uninstall left behind RemotePCDiagnosticsAgent service'
          }
          "MSI install + tokenized filename enrollment + clean uninstall smoke-test passed."

      - name: Upload standalone MSP Fleet Agent
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Agent-win-x64
          path: |
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.exe
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.exe.sha256
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.msi
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.msi.sha256
          if-no-files-found: error
          retention-days: 5

  smoke:
    name: MSIX and Playwright smoke test
    if: ${{ !(inputs.testshop_only || (github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[testshop-only]'))) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/setup-rpcd

      - name: Publish and verify the app
        shell: pwsh
        run: |
          pwsh -NoProfile -File installer/Build-Installer.ps1 -StageOnly
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 -StageOnly failed ($LASTEXITCODE)" }

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        env:
          INPUT_MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          INPUT_MSIX_PUBLISHER: ${{ inputs.msix_publisher || vars.MSIX_PUBLISHER }}
        run: |
          $msixArgs = @('-NoProfile', '-File', 'msix/Build-Msix.ps1', '-SkipPublish')
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_MSIX_IDENTITY_NAME)) {
            $msixArgs += @('-IdentityName', $env:INPUT_MSIX_IDENTITY_NAME.Trim())
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_MSIX_PUBLISHER)) {
            $msixArgs += @('-Publisher', $env:INPUT_MSIX_PUBLISHER.Trim())
          }
          pwsh @msixArgs
          if ($LASTEXITCODE -ne 0) { throw "Build-Msix.ps1 failed ($LASTEXITCODE)" }
          $msix = Get-ChildItem artifacts/msix -Filter 'RemotePCDiagnostics-*-win-x64.msix' | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced' }
          "Built MSIX: $($msix.FullName) ($([Math]::Round($msix.Length / 1MB, 2)) MB)"

      - name: Upload Microsoft Store MSIX package
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Msix-win-x64
          path: |
            artifacts/msix/RemotePCDiagnostics-*-win-x64.msix
            artifacts/msix/RemotePCDiagnostics-*-win-x64.msix.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Install Playwright
        working-directory: tests/smoke
        run: npm install --no-audit --no-fund

      - name: Launch Host and run Playwright smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          $exe = Get-Item artifacts/installer-stage/RemotePCDiagnostics.Host.exe
          # Launch Host in simulated Standard User mode (asInvoker) so Playwright exercises both un-elevated diagnostics and live Agent.exe Named-Pipe connection.
          $env:RPD_SIMULATE_STANDARD_USER = '1'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:RPD_LOG_FILE = Join-Path $art 'host.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden -PassThru
          "Host started, pid $($p.Id)"
          $code = 1
          try {
            $env:APP_PID = $p.Id
            $env:CDP_PORT = '9222'
            $env:ARTIFACT_DIR = $art
            $env:STORE_SCREENSHOT_DIR = Join-Path $art 'store-screenshots'
            Push-Location tests/smoke
            try {
              node smoke.mjs 2>&1 | Tee-Object -FilePath (Join-Path $art 'smoke.txt')
              $code = $LASTEXITCODE
              if ($code -eq 0) {
                node store-screenshots.mjs 2>&1 | Tee-Object -FilePath (Join-Path $art 'store-screenshots.txt')
                $code = $LASTEXITCODE
              }
            } finally { Pop-Location }
            if ($code -ne 0) {
              # Surface the failure as annotations (readable without downloading logs).
              Get-Content (Join-Path $art 'smoke.txt') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { "::error title=smoke::" + ([string]$_).Replace('%', '%25') }
              Get-Content (Join-Path $art 'store-screenshots.txt') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { "::error title=store-screenshots::" + ([string]$_).Replace('%', '%25') }
              Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue | Select-String -Pattern 'error|exception|fail' | Select-Object -Last 8 | ForEach-Object { "::warning title=host.log::" + ([string]$_).Replace('%', '%25') }
              Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-File (Join-Path $art 'webview2-processes.txt')
              netstat -ano | Select-String ':9222' | Out-File (Join-Path $art 'netstat-9222.txt')
              Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue
            }
          } finally {
            Remove-Item Env:RPD_SIMULATE_STANDARD_USER -ErrorAction SilentlyContinue
            Remove-Item Env:STORE_SCREENSHOT_DIR -ErrorAction SilentlyContinue
            if ($p.HasExited) {
              "Host exited with code $($p.ExitCode)"
            } else {
              & taskkill.exe /F /T /PID $p.Id 2>$null | Out-Null
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
          exit $code

      - name: Upload Partner Center Store screenshots (1920x1080)
        uses: actions/upload-artifact@v4
        with:
          name: partner-center-screenshots
          path: artifacts/store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      # Logs and test results only (no binaries), and only when the job failed.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-smoke
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.png
            artifacts/installer/*.log
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish GitHub release
    if: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.release_tag != ''))) && !inputs.testshop_only }}
    needs: [service-workflow, build-test, installer, testshop, agent, smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: release-assets

      - name: Download TestShop demo bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-TestShop-Setup-win-x64
          path: release-assets

      - name: Download Microsoft Store MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Msix-win-x64
          path: release-assets

      - name: Download standalone MSP Fleet Agent artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Agent-win-x64
          path: release-assets

      # In-app, helper and remote updates refuse an installer or Agent MSI without a matching .sha256 asset,
      # so a release that is missing one (or has a stale one) must not be published.
      - name: Verify every installer has a matching SHA-256 file
        working-directory: release-assets
        run: |
          shopt -s nullglob
          count=0
          for f in *.exe *.msi *.msix; do
            if [[ ! -f "$f.sha256" ]]; then
              echo "::error::Missing checksum file $f.sha256"
              exit 1
            fi
            sha256sum --check --strict "$f.sha256"
            count=$((count + 1))
          done
          if [[ $count -lt 5 ]]; then
            echo "::error::Expected at least 5 release binaries, found $count"
            exit 1
          fi

      - name: Publish release or rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          setup_file=$(basename release-assets/RemotePCDiagnostics-Setup-*-win-x64.exe)
          testshop_file=$(basename release-assets/RemotePCDiagnostics-TestShop-Setup-*-win-x64.exe)
          msix_file=$(basename release-assets/RemotePCDiagnostics-*-win-x64.msix)
          agent_file=$(basename release-assets/RemotePCDiagnostics.Agent-*-win-x64.exe)
          agent_msi_file=$(basename release-assets/RemotePCDiagnostics.Agent-*-win-x64.msi)
          ver="${setup_file#RemotePCDiagnostics-Setup-}"
          ver="${ver%-win-x64.exe}"
          target_version="$ver"

          target_tag=""
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            target_tag="${GIT_REF#refs/tags/}"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            target_tag="$INPUT_RELEASE_TAG"
          fi

          {
            echo "Build version: \`${ver}-ci.${GITHUB_RUN_NUMBER}.1\`"
            echo
            if [[ -n "$target_tag" ]]; then
              echo "Windows x64 self-contained installer (\`${setup_file}\`), Test-Shop demo bundle (\`${testshop_file}\`), Microsoft Store MSIX package (\`${msix_file}\`), and standalone MSP Fleet Agent (\`${agent_msi_file}\` / \`${agent_file}\`) built by GitHub Actions from commit \`${GITHUB_SHA}\`."
            else
              echo "Rolling pre-release Windows x64 self-contained installer (\`${setup_file}\`), Test-Shop demo bundle (\`${testshop_file}\`), Microsoft Store MSIX package (\`${msix_file}\`), and standalone MSP Fleet Agent (\`${agent_msi_file}\` / \`${agent_file}\`) built from \`main\` commit \`${GITHUB_SHA}\`."
            fi
            cat <<'EOF'

          ### Overview
          **Remote PC Diagnostics** is an MIT-licensed Windows 10/11 desktop diagnostic and service-workflow application usable locally on the bench or remotely via [RemoteBlazorWebView](https://github.com/budcribar/RemoteBlazorWebView). It launches in Standard User (`asInvoker`) mode with zero immediate UAC prompt and includes an on-demand elevated repair helper (`RemotePCDiagnostics.Agent.exe`), hardware inventory, SMART/drive health, live sensors, thermal-safe CPU/RAM/disk/GPU/network stress tests, Buyer Hardware QA QR certificates, guided Windows repair (`DISM` / `SFC`) with before/after benchmarking, and client HTML service reports.

          ### Installation & Uninstallation
          - **Interactive install:** Run `RemotePCDiagnostics-Setup-*-win-x64.exe`.
          - **Silent install:** `RemotePCDiagnostics-Setup-*-win-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`
          - **Test-Shop Demo Bundle (RPCD + RPCDA):** Run `RemotePCDiagnostics-TestShop-Setup-*-win-x64.exe` to install both the desktop app (`RemotePCDiagnostics.Host.exe`) and the persistent `RemotePCDiagnosticsAgent` Windows Service pre-configured for demo group `test-shop`.
          - **Microsoft Store MSIX upload:** Upload `RemotePCDiagnostics-*-win-x64.msix` to Microsoft Partner Center (`runFullTrust` + `allowElevation`, zero `.sys` drivers, no background service bundled).
          - **MSP / RMM Fleet Agent (Windows Installer `.msi`):** Download a pre-configured `RemotePCDiagnostics-Agent.<mode>.<key>.pkg.msi` from your admin portal and double-click to install, or deploy silently via RMM/Intune/GPO: `msiexec /i RemotePCDiagnostics.Agent-*-win-x64.msi /qn ENROLLMENT_KEY=rpd_live_YOUR_KEY CONSENT=ask LIFETIME=persistent`.
          - **MSP / RMM Fleet Agent (standalone `.exe` CLI):** `RemotePCDiagnostics.Agent-*-win-x64.exe install --server=https://server.remoteblazorwebview.com:34544 --key=rpd_live_YOUR_KEY --consent=ask --lifetime=persistent` (`status` and `uninstall` subcommands included).
          - **Uninstall:** Uninstall **Remote PC Diagnostics** or **Remote PC Diagnostics Agent** from **Windows Settings > Apps > Installed apps**.

          ### Privacy & security policy
          Standalone GitHub Release installers, MSIX packages, and Fleet Agent binaries are built automatically by GitHub Actions (`.sha256` checksums attached); Partner Center signs the MSIX package with Microsoft's Store certificate on Store submission.

          This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it. See the full [Privacy & security policy](https://github.com/budcribar/RemotePCDiagnostics#privacy--security-policy) for details.
          EOF
          } | sed 's/^          //' > release-notes.md

          if [[ -n "$target_tag" ]]; then
            gh release delete "$target_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$target_tag" release-assets/* \
              --latest \
              --target "$GITHUB_SHA" \
              --title "Remote PC Diagnostics ${ver}" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            # Update rolling pre-release in place without deleting to avoid 404 outages during builds.
            if gh release view prerelease --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              gh release edit prerelease \
                --title "Remote PC Diagnostics ${target_version} (${GITHUB_SHA:0:7})" \
                --notes-file release-notes.md \
                --repo "$GITHUB_REPOSITORY"
              gh release upload prerelease release-assets/* \
                --clobber \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release create prerelease release-assets/* \
                --title "Remote PC Diagnostics ${target_version} (${GITHUB_SHA:0:7})" \
                --prerelease \
                --notes-file release-notes.md \
                --repo "$GITHUB_REPOSITORY"
            fi
          fi
