name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RemotePCDiagnostics.sln

      - name: Build (Release)
        run: dotnet build RemotePCDiagnostics.sln -c Release --no-restore

      - name: Verify bundled osqueryi.exe in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $osq = Join-Path $exe.DirectoryName 'tools/osquery/osqueryi.exe'
          if (-not (Test-Path $osq)) { throw "osqueryi.exe missing from Host output: $osq" }
          (Get-FileHash $osq -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature $osq) | Format-List Status, SignerCertificate
          & $osq --json "SELECT hardware_vendor, hardware_model, physical_memory FROM system_info;"
          if ($LASTEXITCODE -ne 0) { throw "osqueryi.exe exited $LASTEXITCODE" }

      - name: Verify bundled HardeningKitty in Host output and run an audit
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $hk = Join-Path $exe.DirectoryName 'tools/HardeningKitty'
          $psd1 = Join-Path $hk 'HardeningKitty.psd1'
          if (-not (Test-Path $psd1)) { throw "HardeningKitty missing from Host output: $psd1" }
          (Get-FileHash (Join-Path $hk 'HardeningKitty.psm1') -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature (Join-Path $hk 'HardeningKitty.psm1')) | Format-List Status, SignerCertificate
          "{0:N1} MB bundled" -f ((Get-ChildItem $hk -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $csv = Join-Path $env:RUNNER_TEMP 'hk-ci/report.csv'
          New-Item -ItemType Directory -Force (Split-Path $csv) | Out-Null
          # Same command line as SecurityAuditModule.BuildArguments (Windows PowerShell 5.1, policy bypass for this process only).
          $cmd = "`$ErrorActionPreference='Stop';`$ProgressPreference='SilentlyContinue';Import-Module -Name '$psd1' -Force;Invoke-HardeningKitty -Mode Audit -Report -ReportFile '$csv' -SkipMachineInformation -SkipLanguageWarning | Out-Null"
          $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job { param($ps, $cmd) & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd 2>&1 | Select-Object -Last 20; "exit=$LASTEXITCODE" } -ArgumentList $ps, $cmd
          if (-not (Wait-Job $job -Timeout 600)) { Stop-Job $job; throw 'HardeningKitty audit exceeded 10 minutes' }
          Receive-Job $job
          "elapsed=$($sw.Elapsed)"
          if (-not (Test-Path $csv)) { throw 'No HardeningKitty report produced' }
          $rows = Import-Csv $csv
          "rows=$($rows.Count)"; $rows | Group-Object TestResult | Format-Table Name, Count
          $rows | Select-Object -First 5 | Format-Table ID, Category, Name, Severity, Result, Recommended, TestResult
          if ($rows.Count -lt 10) { throw "Too few audit rows: $($rows.Count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $csv artifacts/hardeningkitty-ci-report.csv

      - name: Verify memory test helper in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $mt = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.MemTest.exe'
          if (-not (Test-Path $mt)) { throw "RemotePCDiagnostics.MemTest.exe missing from Host output: $mt" }
          $out = & $mt --bytes 67108864 --seconds 2
          $out | Select-Object -Last 2
          if (-not ($out -match '^MT DONE 67108864 \d+ 0$')) { throw "memory test helper did not report a clean DONE" }

      - name: Unit tests
        run: dotnet test RemotePCDiagnostics.sln -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/test-results -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Output "::notice title=Unit tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed)"
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' } | Select-Object -First 40 | ForEach-Object {
              $m = ([string]$_.Output.ErrorInfo.Message) -replace '\r?\n', ' '
              if ($m.Length -gt 300) { $m = $m.Substring(0, 300) }
              $t = ([string]$_.testName).Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
              Write-Output "::error title=$t::$($m.Replace('%', '%25'))"
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: tests/smoke
        run: npm install --no-audit --no-fund

      - name: Launch Host and run Playwright smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          if (-not $exe) { throw 'Host exe not found' }
          # Runners are already elevated, so the requireAdministrator manifest does not prompt.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:RPD_LOG_FILE = Join-Path $art 'host.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          "Host started, pid $($p.Id)"
          $env:APP_PID = $p.Id
          $env:CDP_PORT = '9222'
          $env:ARTIFACT_DIR = $art
          Push-Location tests/smoke
          try { node smoke.mjs; $code = $LASTEXITCODE } finally { Pop-Location }
          if ($code -ne 0) {
            Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-File (Join-Path $art 'webview2-processes.txt')
            netstat -ano | Select-String ':9222' | Out-File (Join-Path $art 'netstat-9222.txt')
            Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue
          }
          if ($p.HasExited) { "Host exited with code $($p.ExitCode)" } else { Stop-Process -Id $p.Id -Force }
          exit $code

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: warn
