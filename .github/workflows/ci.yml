name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RemotePCDiagnostics.sln

      - name: Build (Release)
        run: dotnet build RemotePCDiagnostics.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test RemotePCDiagnostics.sln -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: tests/smoke
        run: npm install --no-audit --no-fund

      - name: Launch Host and run Playwright smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          if (-not $exe) { throw 'Host exe not found' }
          # Runners are already elevated, so the requireAdministrator manifest does not prompt.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:RPD_LOG_FILE = Join-Path $art 'host.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          "Host started, pid $($p.Id)"
          $env:APP_PID = $p.Id
          $env:CDP_PORT = '9222'
          $env:ARTIFACT_DIR = $art
          Push-Location tests/smoke
          try { node smoke.mjs; $code = $LASTEXITCODE } finally { Pop-Location }
          if ($p.HasExited) { "Host exited with code $($p.ExitCode)" } else { Stop-Process -Id $p.Id -Force }
          exit $code

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: warn
