name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - prerelease
      - 'build-*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag to publish as a full GitHub Release (e.g. v1.2.0). Leave empty for rolling pre-release.'
        required: false
        type: string
        default: ''
      msix_identity_name:
        description: 'Optional Partner Center Package/Identity/Name (e.g. 12345BudCribar.RemotePCDiagnostics). Falls back to vars.MSIX_IDENTITY_NAME.'
        required: false
        type: string
        default: ''
      msix_publisher:
        description: 'Optional Partner Center Package/Identity/Publisher (e.g. CN=00000000-0000-0000-0000-000000000000). Falls back to vars.MSIX_PUBLISHER.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  service-workflow:
    name: Service workflow (simulated restarts)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure RemoteBlazorWebView packages
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:GITHUB_WORKSPACE 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          if (@(Get-ChildItem $pkgDir -Filter 'PeakSWC.RemoteBlazorWebView.RemoteComponents.*.nupkg' -ErrorAction SilentlyContinue).Count -eq 0) {
            [xml]$props = Get-Content Directory.Build.props
            $rbwvNode = $props.Project.PropertyGroup | ForEach-Object { $_['RbwvVersion'] } | Where-Object { $_ } | Select-Object -First 1
            $rbwvVer = if ($rbwvNode -is [System.Xml.XmlElement]) { $rbwvNode.InnerText.Trim() } else { "$rbwvNode".Trim() }
            $verLower = $rbwvVer.ToLowerInvariant()
            $onNuGet = $false
            try {
              $resp = Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/peakswc.remoteblazorwebview.remotecomponents/$verLower/peakswc.remoteblazorwebview.remotecomponents.$verLower.nupkg" -Method Head -UseBasicParsing -TimeoutSec 10
              $onNuGet = ($resp.StatusCode -eq 200)
            } catch { $onNuGet = $false }
            if ($onNuGet) {
              "Using PeakSWC.RemoteBlazorWebView.RemoteComponents $rbwvVer from nuget.org."
            } else {
              $suffix = if ($rbwvVer -match '-(.+)$') { $Matches[1] } else { '' }
              $srcRoot = Join-Path $env:RUNNER_TEMP 'rbwv-src/RemoteBlazorWebView'
              git clone --branch net10 --depth 1 https://github.com/budcribar/RemoteBlazorWebView.git $srcRoot
              $packArgs = @('pack', "$srcRoot/src/RemoteBlazorWebView.RemoteComponents", '-c', 'Release', '-p:GeneratePackageOnBuild=false', '-o', $pkgDir)
              if ($suffix) { $packArgs += "-p:VersionSuffix=$suffix" }
              & dotnet @packArgs
              if ($LASTEXITCODE -ne 0) { throw "Packing RemoteComponents failed ($LASTEXITCODE)" }
            }
          }
      - name: Test workflow, saved-state resume, and client reports
        run: dotnet test --project tests/RemotePCDiagnostics.Tests/RemotePCDiagnostics.Tests.csproj -c Release --filter-class "RemotePCDiagnostics.Tests.WorkflowTests" --report-xunit-trx --report-xunit-trx-filename workflow.trx --results-directory artifacts/workflow-tests
      - name: Verify workflow tests ran
        shell: pwsh
        run: |
          [xml]$results = Get-Content artifacts/workflow-tests/workflow.trx
          $counts = $results.TestRun.ResultSummary.Counters
          if ([int]$counts.executed -lt 1) { throw 'No service workflow tests executed' }
          if ([int]$counts.failed -gt 0) { throw 'Service workflow tests failed' }
          "Service workflow tests: $($counts.passed) passed"
      - name: Upload workflow test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-workflow-results
          path: artifacts/workflow-tests/
          if-no-files-found: warn
          retention-days: 3

  build-test-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure RemoteBlazorWebView packages
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:GITHUB_WORKSPACE 'third_party/RemoteBlazorWebView/packages'
          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          if (@(Get-ChildItem $pkgDir -Filter 'PeakSWC.RemoteBlazorWebView.Wpf.*.nupkg' -ErrorAction SilentlyContinue).Count -eq 0) {
            [xml]$props = Get-Content Directory.Build.props
            $rbwvNode = $props.Project.PropertyGroup | ForEach-Object { $_['RbwvVersion'] } | Where-Object { $_ } | Select-Object -First 1
            $rbwvVer = if ($rbwvNode -is [System.Xml.XmlElement]) { $rbwvNode.InnerText.Trim() } else { "$rbwvNode".Trim() }
            $verLower = $rbwvVer.ToLowerInvariant()
            $onNuGet = $true
            foreach ($pkg in 'peakswc.remoteblazorwebview.remotecomponents', 'peakswc.remoteblazorwebview.wpf', 'peakswc.remotewebview', 'peakswc.remotewebviewservice.lib') {
              try {
                $resp = Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$pkg/$verLower/$pkg.$verLower.nupkg" -Method Head -UseBasicParsing -TimeoutSec 10
                if ($resp.StatusCode -ne 200) { $onNuGet = $false; break }
              } catch { $onNuGet = $false; break }
            }
            if ($onNuGet) {
              "Using PeakSWC.RemoteBlazorWebView packages ($rbwvVer) from nuget.org."
            } else {
              $suffix = if ($rbwvVer -match '-(.+)$') { $Matches[1] } else { '' }
              $work = Join-Path $env:RUNNER_TEMP 'rbwv-build'
              $srcRoot = Join-Path $work 'RemoteBlazorWebView'
              $tutorialStub = Join-Path $work 'RemoteBlazorWebViewTutorial'
              New-Item -ItemType Directory -Force $tutorialStub | Out-Null
              Set-Content -Path (Join-Path $tutorialStub 'README.md') -Value '# RemoteBlazorWebView'
              git clone --branch net10 --depth 1 https://github.com/budcribar/RemoteBlazorWebView.git $srcRoot
              Push-Location (Join-Path $srcRoot 'src/RemoteWebView.Blazor.JS')
              try {
                # Enable corepack yarn for Web.JS submodule build invoked by build:production, or use npm + webpack.
                corepack enable
                yarn install
                if ($LASTEXITCODE -ne 0) { throw "yarn install failed ($LASTEXITCODE)" }
                npm run build:production
                if ($LASTEXITCODE -ne 0) { throw "JS bundle build failed ($LASTEXITCODE)" }
              } finally { Pop-Location }
              foreach ($p in 'RemoteWebViewService.Lib', 'RemoteWebView', 'RemoteBlazorWebView.RemoteComponents', 'RemoteBlazorWebView.Wpf') {
                $packArgs = @('pack', "$srcRoot/src/$p", '-c', 'Release', '-p:GeneratePackageOnBuild=false', '-o', $pkgDir)
                if ($suffix) { $packArgs += "-p:VersionSuffix=$suffix" }
                & dotnet @packArgs
                if ($LASTEXITCODE -ne 0) { throw "dotnet pack $p failed ($LASTEXITCODE)" }
              }
            }
          }

      - name: Restore
        run: dotnet restore RemotePCDiagnostics.sln

      - name: Build (Release)
        run: dotnet build RemotePCDiagnostics.sln -c Release --no-restore

      - name: Verify bundled osqueryi.exe in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $osq = Join-Path $exe.DirectoryName 'tools/osquery/osqueryi.exe'
          if (-not (Test-Path $osq)) { throw "osqueryi.exe missing from Host output: $osq" }
          (Get-FileHash $osq -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature $osq) | Format-List Status, SignerCertificate
          & $osq --json "SELECT hardware_vendor, hardware_model, physical_memory FROM system_info;"
          if ($LASTEXITCODE -ne 0) { throw "osqueryi.exe exited $LASTEXITCODE" }

      - name: Verify bundled HardeningKitty in Host output and run an audit
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $hk = Join-Path $exe.DirectoryName 'tools/HardeningKitty'
          $psd1 = Join-Path $hk 'HardeningKitty.psd1'
          if (-not (Test-Path $psd1)) { throw "HardeningKitty missing from Host output: $psd1" }
          (Get-FileHash (Join-Path $hk 'HardeningKitty.psm1') -Algorithm SHA256).Hash
          (Get-AuthenticodeSignature (Join-Path $hk 'HardeningKitty.psm1')) | Format-List Status, SignerCertificate
          "{0:N1} MB bundled" -f ((Get-ChildItem $hk -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $csv = Join-Path $env:RUNNER_TEMP 'hk-ci/report.csv'
          New-Item -ItemType Directory -Force (Split-Path $csv) | Out-Null
          # Same command line as SecurityAuditModule.BuildArguments (Windows PowerShell 5.1, policy bypass for this process only).
          $cmd = "`$ErrorActionPreference='Stop';`$ProgressPreference='SilentlyContinue';Import-Module -Name '$psd1' -Force;Invoke-HardeningKitty -Mode Audit -Report -ReportFile '$csv' -SkipMachineInformation -SkipLanguageWarning | Out-Null"
          $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $job = Start-Job { param($ps, $cmd) & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd 2>&1 | Select-Object -Last 20; "exit=$LASTEXITCODE" } -ArgumentList $ps, $cmd
          try {
            if (-not (Wait-Job $job -Timeout 600)) { Stop-Job $job; throw 'HardeningKitty audit exceeded 10 minutes' }
            $jobOut = Receive-Job $job
            $jobOut
            if (-not (@($jobOut | ForEach-Object { "$_" }) -contains 'exit=0')) { throw 'HardeningKitty PowerShell failed' }
          } finally {
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
          "elapsed=$($sw.Elapsed)"
          if (-not (Test-Path $csv)) { throw 'No HardeningKitty report produced' }
          $rows = Import-Csv $csv
          "rows=$($rows.Count)"; $rows | Group-Object TestResult | Format-Table Name, Count
          $rows | Select-Object -First 5 | Format-Table ID, Category, Name, Severity, Result, Recommended, TestResult
          if ($rows.Count -lt 10) { throw "Too few audit rows: $($rows.Count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $csv artifacts/hardeningkitty-ci-report.csv

      - name: Verify memory test and admin repair helpers in Host output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/RemotePCDiagnostics.Host/bin/Release -Recurse -Filter RemotePCDiagnostics.Host.exe | Select-Object -First 1
          $mt = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.MemTest.exe'
          if (-not (Test-Path $mt)) { throw "RemotePCDiagnostics.MemTest.exe missing from Host output: $mt" }
          $out = & $mt --bytes 67108864 --seconds 2
          $out | Select-Object -Last 2
          if (-not ($out -match '^MT DONE 67108864 \d+ 0$')) { throw "memory test helper did not report a clean DONE" }

          $adminExe = Join-Path $exe.DirectoryName 'RemotePCDiagnostics.Admin.exe'
          if (-not (Test-Path $adminExe)) { throw "RemotePCDiagnostics.Admin.exe missing from Host output: $adminExe" }
          & $adminExe --self-check
          if ($LASTEXITCODE -ne 0) { throw "RemotePCDiagnostics.Admin.exe --self-check exited $LASTEXITCODE" }

      - name: Unit tests
        run: dotnet test --solution RemotePCDiagnostics.sln -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build and smoke-test Windows installer (Inno Setup)
        shell: pwsh
        run: |
          pwsh -NoProfile -File installer/Build-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 failed ($LASTEXITCODE)" }

          $setup = Get-ChildItem artifacts/installer -Filter 'RemotePCDiagnostics-Setup-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer executable was not produced' }

          $installDir = Join-Path $env:RUNNER_TEMP 'rpd-installed'
          $installProc = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SKIPWEBVIEW2 /DIR=`"$installDir`"" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) { throw "Silent install failed with exit code $($installProc.ExitCode)" }

          $installedHost = Join-Path $installDir 'RemotePCDiagnostics.Host.exe'
          $installedAdmin = Join-Path $installDir 'RemotePCDiagnostics.Admin.exe'
          $installedUiHost = Join-Path $installDir 'moduleui/RemotePCDiagnostics.ModuleUiHost.exe'
          if (-not (Test-Path -LiteralPath $installedHost)) { throw "Installed Host missing: $installedHost" }
          if (-not (Test-Path -LiteralPath $installedAdmin)) { throw "Installed Admin helper missing: $installedAdmin" }
          if (-not (Test-Path -LiteralPath $installedUiHost)) { throw "Installed ModuleUiHost missing: $installedUiHost" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'modules'))) { throw 'modules folder was not created by installer' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'checks'))) { throw 'checks folder was not created by installer' }

          $env:RPD_LOG_FILE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installed-package-check.log'
          $verify = Start-Process -FilePath $installedHost -ArgumentList '--verify-package' -WorkingDirectory $installDir -WindowStyle Hidden -PassThru
          if (-not $verify.WaitForExit(60000)) { & taskkill.exe /F /T /PID $verify.Id 2>$null | Out-Null; Stop-Process -Id $verify.Id -Force -ErrorAction SilentlyContinue; throw 'Installed package verification timed out' }
          if ($verify.ExitCode -ne 0) { throw "Installed package verification failed: $($verify.ExitCode)" }
          Get-Content $env:RPD_LOG_FILE
          Remove-Item Env:RPD_LOG_FILE -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Uninstaller missing: $uninstaller" }
          $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstallProc.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstallProc.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $installedHost); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installedHost) { throw 'Uninstaller left RemotePCDiagnostics.Host.exe behind' }
          "Installer silent install, package check, and silent uninstall verified."

      - name: Upload Windows installer
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: |
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe
            artifacts/installer/RemotePCDiagnostics-Setup-*-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        env:
          INPUT_MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name || vars.MSIX_IDENTITY_NAME }}
          INPUT_MSIX_PUBLISHER: ${{ inputs.msix_publisher || vars.MSIX_PUBLISHER }}
        run: |
          $msixArgs = @('-NoProfile', '-File', 'msix/Build-Msix.ps1', '-SkipPublish')
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_MSIX_IDENTITY_NAME)) {
            $msixArgs += @('-IdentityName', $env:INPUT_MSIX_IDENTITY_NAME.Trim())
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_MSIX_PUBLISHER)) {
            $msixArgs += @('-Publisher', $env:INPUT_MSIX_PUBLISHER.Trim())
          }
          pwsh @msixArgs
          if ($LASTEXITCODE -ne 0) { throw "Build-Msix.ps1 failed ($LASTEXITCODE)" }
          $msix = Get-ChildItem artifacts/msix -Filter 'RemotePCDiagnostics-*-win-x64.msix' | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced' }
          "Built MSIX: $($msix.FullName) ($([Math]::Round($msix.Length / 1MB, 2)) MB)"

      - name: Upload Microsoft Store MSIX package
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Msix-win-x64
          path: |
            artifacts/msix/RemotePCDiagnostics-*-win-x64.msix
            artifacts/msix/RemotePCDiagnostics-*-win-x64.msix.sha256
          if-no-files-found: error
          retention-days: 5

      - name: Publish and smoke-test standalone MSP Fleet Agent (RemotePCDiagnostics.Agent)
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_['Version'] } | Where-Object { $_ } | Select-Object -First 1).InnerText.Trim()
          $pubDir = Join-Path $env:RUNNER_TEMP 'agent-publish'
          if (Test-Path $pubDir) { Remove-Item $pubDir -Recurse -Force }
          dotnet publish src/RemotePCDiagnostics.Agent/RemotePCDiagnostics.Agent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o $pubDir
          if ($LASTEXITCODE -ne 0) { throw "Agent publish failed ($LASTEXITCODE)" }

          $publishedExe = Join-Path $pubDir 'RemotePCDiagnostics.Agent.exe'
          if (-not (Test-Path -LiteralPath $publishedExe)) { throw "Published Agent missing: $publishedExe" }

          $agentOutDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent'
          New-Item -ItemType Directory -Force $agentOutDir | Out-Null
          $agentFileName = "RemotePCDiagnostics.Agent-$ver-win-x64.exe"
          $agentDest = Join-Path $agentOutDir $agentFileName
          Copy-Item -LiteralPath $publishedExe -Destination $agentDest -Force

          $hash = (Get-FileHash -LiteralPath $agentDest -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$agentDest.sha256", "$hash  $agentFileName", $utf8NoBom)

          $checkOut = & $agentDest --self-check
          $checkOut
          if ($LASTEXITCODE -ne 0) { throw "Agent --self-check failed ($LASTEXITCODE)" }

          $helpOut = & $agentDest help
          if ($LASTEXITCODE -ne 0 -or ($helpOut -join "`n") -notmatch 'RemotePCDiagnostics\.Agent\.exe install') {
            throw "Agent help output unexpected ($LASTEXITCODE)"
          }

          $env:RPD_AGENT_CONFIG_PATH = Join-Path $env:RUNNER_TEMP 'rpd-agent-ci/agent.json'
          try {
            $statusOut = & $agentDest status
            $statusOut
            if ($LASTEXITCODE -ne 0 -or ($statusOut -join "`n") -notmatch 'RemotePCDiagnosticsAgent') {
              throw "Agent status failed ($LASTEXITCODE)"
            }
          } finally {
            Remove-Item Env:RPD_AGENT_CONFIG_PATH -ErrorAction SilentlyContinue
          }
          "Built standalone Agent EXE: $agentDest ($([Math]::Round((Get-Item $agentDest).Length / 1MB, 2)) MB, sha256=$hash)"

          pwsh -NoProfile -File msi/Build-AgentMsi.ps1 -Version $ver -SkipPublish -AgentExePath $agentDest -OutputDir $agentOutDir
          if ($LASTEXITCODE -ne 0) { throw "Build-AgentMsi.ps1 failed ($LASTEXITCODE)" }

          $agentMsi = Join-Path $agentOutDir "RemotePCDiagnostics.Agent-$ver-win-x64.msi"
          if (-not (Test-Path -LiteralPath $agentMsi)) { throw "Agent MSI missing: $agentMsi" }
          if (-not (Test-Path -LiteralPath "$agentMsi.sha256")) { throw "Agent MSI sha256 missing: $agentMsi.sha256" }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'rpd-msi-smoke'
          if (Test-Path $smokeDir) { Remove-Item $smokeDir -Recurse -Force }
          New-Item -ItemType Directory -Force $smokeDir | Out-Null
          $b64Loopback = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('http://127.0.0.1:9')).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          $tokenizedMsi = Join-Path $smokeDir "RemotePCDiagnostics-Agent.as.rpd_inv_cismoketest123456.h.$b64Loopback.pkg (1).msi"
          Copy-Item -LiteralPath $agentMsi -Destination $tokenizedMsi -Force

          $installLog = Join-Path $smokeDir 'msi-install.log'
          $installProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$tokenizedMsi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 | Write-Host }
            throw "MSI install smoke-test failed with exit code $($installProc.ExitCode)"
          }

          try {
            $installedExe = 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
            $installedCfg = 'C:\ProgramData\RemotePCDiagnostics\agent.json'
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "MSI did not install $installedExe" }
            if (-not (Test-Path -LiteralPath $installedCfg)) { throw "MSI did not write $installedCfg" }
            $cfgJson = Get-Content -LiteralPath $installedCfg -Raw | ConvertFrom-Json
            if ($cfgJson.key -ne 'rpd_inv_cismoketest123456' -or $cfgJson.consent -ne 'ask' -or $cfgJson.lifetime -ne 'session' -or $cfgJson.server -ne 'http://127.0.0.1:9') {
              throw "Unexpected agent.json written by MSI: $(Get-Content -LiteralPath $installedCfg -Raw)"
            }
            $svc = Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue
            if ($null -eq $svc -or $svc.Status -ne 'Running') {
              throw "Expected RemotePCDiagnosticsAgent service Running after MSI install, got: $($svc.Status)"
            }
          } finally {
            $uninstallLog = Join-Path $smokeDir 'msi-uninstall.log'
            $uninstallProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/x', "`"$tokenizedMsi`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") -Wait -PassThru
            if ($uninstallProc.ExitCode -ne 0) {
              if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 120 | Write-Host }
              throw "MSI uninstall smoke-test failed with exit code $($uninstallProc.ExitCode)"
            }
          }

          if (Test-Path -LiteralPath 'C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe') {
            throw 'MSI uninstall left behind C:\Program Files\RemotePCDiagnosticsAgent\RemotePCDiagnostics.Agent.exe'
          }
          if (Test-Path -LiteralPath 'C:\ProgramData\RemotePCDiagnostics\agent.json') {
            throw 'MSI uninstall left behind C:\ProgramData\RemotePCDiagnostics\agent.json'
          }
          if ($null -ne (Get-Service -Name 'RemotePCDiagnosticsAgent' -ErrorAction SilentlyContinue)) {
            throw 'MSI uninstall left behind RemotePCDiagnosticsAgent service'
          }
          "MSI install + tokenized filename enrollment + clean uninstall smoke-test passed."

      - name: Upload standalone MSP Fleet Agent
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RemotePCDiagnostics-Agent-win-x64
          path: |
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.exe
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.exe.sha256
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.msi
            artifacts/agent/RemotePCDiagnostics.Agent-*-win-x64.msi.sha256
          if-no-files-found: error
          retention-days: 5

      # The standalone prototypes live outside RemotePCDiagnostics.sln (tools/prototypes/Prototypes.slnx); build them so they keep compiling.
      - name: Build prototypes
        run: dotnet build tools/prototypes/Prototypes.slnx -c Release

      - name: Publish OutlookBenchmark (single exe)
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/OutlookBenchmark/OutlookBenchmark.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/OutlookBenchmark
          $exe = 'artifacts/OutlookBenchmark/OutlookBenchmark.exe'
          if (-not (Test-Path $exe)) { throw 'OutlookBenchmark.exe was not published' }
          # Smoke run on the runner (no Outlook there): inventory only, must exit 0 and write results.
          & $exe --skip-start-test --no-reference --yes --out artifacts/OutlookBenchmark/smoke-results
          if ($LASTEXITCODE -ne 0) { throw "OutlookBenchmark exited $LASTEXITCODE" }
          if (-not (Test-Path artifacts/OutlookBenchmark/smoke-results/results.csv)) { throw 'results.csv missing' }
          Get-Content artifacts/OutlookBenchmark/smoke-results/results.csv

      - name: Publish network history prototype and test demo export
        shell: pwsh
        run: |
          dotnet publish tools/prototypes/NetworkUsagePrototype/NetworkUsagePrototype.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/NetworkUsagePrototype
          if ($LASTEXITCODE -ne 0) { throw 'Network usage prototype publish failed' }
          Copy-Item tools/prototypes/NetworkUsagePrototype/README.md artifacts/NetworkUsagePrototype/README.md
          & artifacts/NetworkUsagePrototype/NetworkUsagePrototype.exe --demo --out artifacts/network-demo
          if ($LASTEXITCODE -ne 0) { throw 'Network usage demo export failed' }
          $report = Get-Content artifacts/network-demo/network-usage.json -Raw | ConvertFrom-Json
          if ($report.Entries.Count -ne 1 -or $report.Source -notlike 'DEMO*') { throw 'Unexpected demo report' }
          if (-not (Test-Path artifacts/network-demo/network-usage.html)) { throw 'HTML report missing' }

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/test-results)) { return }
          Get-ChildItem artifacts/test-results -Recurse -Filter *.trx | ForEach-Object {
            [xml]$x = Get-Content $_.FullName
            $c = $x.TestRun.ResultSummary.Counters
            Write-Output "::notice title=Unit tests::total=$($c.total) passed=$($c.passed) failed=$($c.failed)"
            $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' } | Select-Object -First 40 | ForEach-Object {
              $m = ([string]$_.Output.ErrorInfo.Message) -replace '\r?\n', ' '
              if ($m.Length -gt 300) { $m = $m.Substring(0, 300) }
              $t = ([string]$_.testName).Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
              Write-Output "::error title=$t::$($m.Replace('%', '%25'))"
            }
          }

      - name: Install Playwright
        working-directory: tests/smoke
        run: npm install --no-audit --no-fund

      - name: Run UI regression checks
        working-directory: tests/smoke
        run: node ui-review.mjs

      - name: Launch Host and run Playwright smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          $exe = Get-Item artifacts/installer-stage/RemotePCDiagnostics.Host.exe
          # Launch Host in simulated Standard User mode (asInvoker) so Playwright exercises both un-elevated diagnostics and live Admin.exe Named-Pipe connection.
          $env:RPD_SIMULATE_STANDARD_USER = '1'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:RPD_LOG_FILE = Join-Path $art 'host.log'
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden -PassThru
          "Host started, pid $($p.Id)"
          $code = 1
          try {
            $env:APP_PID = $p.Id
            $env:CDP_PORT = '9222'
            $env:ARTIFACT_DIR = $art
            $env:STORE_SCREENSHOT_DIR = Join-Path $art 'store-screenshots'
            Push-Location tests/smoke
            try {
              node smoke.mjs 2>&1 | Tee-Object -FilePath (Join-Path $art 'smoke.txt')
              $code = $LASTEXITCODE
              if ($code -eq 0) {
                node store-screenshots.mjs 2>&1 | Tee-Object -FilePath (Join-Path $art 'store-screenshots.txt')
                $code = $LASTEXITCODE
              }
            } finally { Pop-Location }
            if ($code -ne 0) {
              # Surface the failure as annotations (readable without downloading logs).
              Get-Content (Join-Path $art 'smoke.txt') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { "::error title=smoke::" + ([string]$_).Replace('%', '%25') }
              Get-Content (Join-Path $art 'store-screenshots.txt') -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { "::error title=store-screenshots::" + ([string]$_).Replace('%', '%25') }
              Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue | Select-String -Pattern 'error|exception|fail' | Select-Object -Last 8 | ForEach-Object { "::warning title=host.log::" + ([string]$_).Replace('%', '%25') }
              Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-File (Join-Path $art 'webview2-processes.txt')
              netstat -ano | Select-String ':9222' | Out-File (Join-Path $art 'netstat-9222.txt')
              Get-Content (Join-Path $art 'host.log') -ErrorAction SilentlyContinue
            }
          } finally {
            Remove-Item Env:RPD_SIMULATE_STANDARD_USER -ErrorAction SilentlyContinue
            Remove-Item Env:STORE_SCREENSHOT_DIR -ErrorAction SilentlyContinue
            if ($p.HasExited) {
              "Host exited with code $($p.ExitCode)"
            } else {
              & taskkill.exe /F /T /PID $p.Id 2>$null | Out-Null
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
          exit $code

      - name: Upload Partner Center Store screenshots (1920x1080)
        uses: actions/upload-artifact@v4
        with:
          name: partner-center-screenshots
          path: artifacts/store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      # Logs, test results and smoke screenshots only (no binaries or publish output), and only when the job failed.
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.csv
            artifacts/test-results/**/*.trx
            artifacts/OutlookBenchmark/smoke-results/
            artifacts/network-demo/
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish GitHub release
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.release_tag != ''))
    needs: [service-workflow, build-test-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Setup-win-x64
          path: release-assets

      - name: Download Microsoft Store MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Msix-win-x64
          path: release-assets

      - name: Download standalone MSP Fleet Agent artifact
        uses: actions/download-artifact@v4
        with:
          name: RemotePCDiagnostics-Agent-win-x64
          path: release-assets

      - name: Publish release or rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          setup_file=$(basename release-assets/RemotePCDiagnostics-Setup-*-win-x64.exe)
          msix_file=$(basename release-assets/RemotePCDiagnostics-*-win-x64.msix)
          agent_file=$(basename release-assets/RemotePCDiagnostics.Agent-*-win-x64.exe)
          agent_msi_file=$(basename release-assets/RemotePCDiagnostics.Agent-*-win-x64.msi)
          ver="${setup_file#RemotePCDiagnostics-Setup-}"
          ver="${ver%-win-x64.exe}"

          target_tag=""
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            target_tag="${GIT_REF#refs/tags/}"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            target_tag="$INPUT_RELEASE_TAG"
          fi

          {
            if [[ -n "$target_tag" ]]; then
              echo "Windows x64 self-contained installer (\`${setup_file}\`), Microsoft Store MSIX package (\`${msix_file}\`), and standalone MSP Fleet Agent (\`${agent_msi_file}\` / \`${agent_file}\`) built by GitHub Actions from commit \`${GITHUB_SHA}\`."
            else
              echo "Rolling pre-release Windows x64 self-contained installer (\`${setup_file}\`), Microsoft Store MSIX package (\`${msix_file}\`), and standalone MSP Fleet Agent (\`${agent_msi_file}\` / \`${agent_file}\`) built from \`main\` commit \`${GITHUB_SHA}\`."
            fi
            cat <<'EOF'

          ### Overview
          **Remote PC Diagnostics** is an MIT-licensed Windows 10/11 desktop diagnostic and service-workflow application usable locally on the bench or remotely via [RemoteBlazorWebView](https://github.com/budcribar/RemoteBlazorWebView). It launches in Standard User (`asInvoker`) mode with zero immediate UAC prompt and includes an on-demand elevated repair helper (`RemotePCDiagnostics.Admin.exe`), hardware inventory, SMART/drive health, live sensors, thermal-safe CPU/RAM/disk/GPU/network stress tests, Buyer Hardware QA QR certificates, guided Windows repair (`DISM` / `SFC`) with before/after benchmarking, and client HTML service reports.

          ### Installation & Uninstallation
          - **Interactive install:** Run `RemotePCDiagnostics-Setup-*-win-x64.exe`.
          - **Silent install:** `RemotePCDiagnostics-Setup-*-win-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`
          - **Microsoft Store MSIX upload:** Upload `RemotePCDiagnostics-*-win-x64.msix` to Microsoft Partner Center (`runFullTrust` + `allowElevation`, zero `.sys` drivers, no background service bundled).
          - **MSP / RMM Fleet Agent (Windows Installer `.msi`):** Download a pre-configured `RemotePCDiagnostics-Agent.<mode>.<key>.pkg.msi` from your admin portal and double-click to install, or deploy silently via RMM/Intune/GPO: `msiexec /i RemotePCDiagnostics.Agent-*-win-x64.msi /qn ENROLLMENT_KEY=rpd_live_YOUR_KEY CONSENT=ask LIFETIME=persistent`.
          - **MSP / RMM Fleet Agent (standalone `.exe` CLI):** `RemotePCDiagnostics.Agent-*-win-x64.exe install --server=https://server.remoteblazorwebview.com:34544 --key=rpd_live_YOUR_KEY --consent=ask --lifetime=persistent` (`status` and `uninstall` subcommands included).
          - **Uninstall:** Uninstall **Remote PC Diagnostics** or **Remote PC Diagnostics Agent** from **Windows Settings > Apps > Installed apps**.

          ### Privacy & security policy
          Standalone GitHub Release installers, MSIX packages, and Fleet Agent binaries are built automatically by GitHub Actions (`.sha256` checksums attached); Partner Center signs the MSIX package with Microsoft's Store certificate on Store submission.

          This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it. See the full [Privacy & security policy](https://github.com/budcribar/RemotePCDiagnostics#privacy--security-policy) for details.
          EOF
          } | sed 's/^          //' > release-notes.md

          if [[ -n "$target_tag" ]]; then
            gh release delete "$target_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$target_tag" release-assets/* \
              --latest \
              --target "$GITHUB_SHA" \
              --title "Remote PC Diagnostics ${ver}" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            # Delete all existing pre-releases (and their tags) so only one current pre-release is kept.
            gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease or .tagName == "prerelease") | .tagName' | while read -r old_tag; do
              [ -z "$old_tag" ] && continue
              gh release delete "$old_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
            done

            gh release create prerelease release-assets/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Remote PC Diagnostics ${ver} (${short_sha})" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
